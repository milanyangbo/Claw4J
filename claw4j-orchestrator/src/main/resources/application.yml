spring:
  application:
    name: claw4j-orchestrator
  ai:
    model:
      chat: none
    deepseek:
      api-key: ${CLAW4J_DEEPSEEK_API_KEY:}
      chat:
        options:
          model: deepseek-reasoner
    dashscope:
      api-key: ${CLAW4J_DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen-plus
          stream: true
          incremental-output: true
  config:
    import:
      - optional:nacos:claw4j-shared.yaml?group=CLAW4J_DEV_GROUP&refreshEnabled=true
      - optional:nacos:${spring.application.name}.yaml?group=CLAW4J_DEV_GROUP&refreshEnabled=true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          claw4j-a2a-broker:
            connectTimeout: 1000
            readTimeout: 3000
    nacos:
      config:
        server-addr: ${CLAW4J_NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: public
        group: CLAW4J_DEV_GROUP
        prefix: ${spring.application.name}
        file-extension: yaml
        refresh-enabled: true
        timeout: 3000
      discovery:
        server-addr: ${CLAW4J_NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: public
        group: CLAW4J_DEV_GROUP
        metadata:
          module: claw4j-orchestrator
          role: orchestrator
          port: ${server.port}
          environment: local

claw4j:
  model:
    streaming:
      response-timeout: 5m
      fallback:
        ttfb-timeout: 5s
        resume-enabled: true
        resume-buffer-size: 10000
        session-retention: 10m
      context:
        primary-max-tokens: 128000
        fallback-max-tokens: 32000
        truncation-strategy: summary
      parser:
        reject-malformed-output: true
      routing:
        primary-model-type: deepseek
        fallback-model-type: qwen

resilience4j:
  circuitbreaker:
    instances:
      deepseek-primary-model:
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 4
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        sliding-window-type: COUNT_BASED
        automatic-transition-from-open-to-half-open-enabled: false
  timelimiter:
    instances:
      deepseek-primary-model:
        timeout-duration: 30s
        cancel-running-future: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
