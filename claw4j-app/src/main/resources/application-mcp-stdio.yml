# 当 MCP server 用的 profile（P11）。
#
# 用法：
#   java -jar claw4j-app/target/claw4j-app-0.1.0-SNAPSHOT.jar \
#        --spring.profiles.active=mcp-stdio --claw4j.mcp.server.expose=querySales
#
# 这一份解决的是 stdio 的硬约束：
#   - **stdout 是协议通道**：启动横幅、日志、Tomcat 的输出默认都往 stdout 走，
#     一帧 JSON 中间插一行日志，客户端报"连不上"而 server 侧一切正常。
#     所以横幅关掉、日志换成 logback-mcp-stdio.xml（出口是 stderr）。
#   - 这个进程是给一个客户端当工具，不是当服务：四个通道与调度都关掉，也不起 servlet 容器，
#     否则本机已经跑着一个 claw4j 时会因为端口被占而起不来。
#
# 库与模型仍要配：交出去的工具真去查表、真去调模型，不是空壳。

spring:
  main:
    banner-mode: "off"
    # 没有容器就没有端口、没有 Actuator 端点。这个进程不对外，只对着一个客户端的管道说话。
    web-application-type: none
  logging:
    config: classpath:logback-mcp-stdio.xml

claw4j:
  mcp:
    server:
      enabled: true
  channel:
    http:
      enabled: false
    feishu:
      enabled: false
    wecom:
      enabled: false
    # 钉钉这一条即使开着也装配不起来（它挂在"是个 servlet 应用"这个条件上），
    # 但写出来是让"这份 profile 关掉了哪些东西"这句话完整——漏掉一个，
    # 下次有人加通道时会照着这份清单补，而清单少一行就没人发现。
    dingtalk:
      enabled: false
  schedule:
    enabled: false
