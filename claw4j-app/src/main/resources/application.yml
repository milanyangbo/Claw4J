# Claw4J 的应用配置。
#
# 写法约定（改这份文件前先看）：
#   - 注释只回答"这是什么、默认值多少、动它之前要知道什么"。设计理由在各配置类的 javadoc
#     与 docs/design/ 下，两边不重复写——两处写同一件事，早晚改一处漏一处。
#   - claw4j.* 的每个键都有明确的拥有者：某个 @ConfigurationProperties 类，或装配类上的
#     @ConditionalOnProperty。在这里加一个没人读的键，就是又一处"配了不生效"。
#   - 凭据一律走环境变量占位符，真实值不进仓库（ADR-0002）。

spring:
  application:
    name: claw4j

  # ---- 运行环境：默认什么都不拉 ----
  # 没有 Docker 时应用照样启动（Hikari 懒连接、Flyway 关）。需要库时用 local profile：
  # 由 Boot 拉起 compose.yaml 并打开迁移，模板见 application-local.yml.example。
  docker:
    compose:
      enabled: false

  datasource:
    url: ${CLAW4J_DB_URL:jdbc:postgresql://localhost:5432/claw4j}
    username: ${CLAW4J_DB_USER:claw4j}
    password: ${CLAW4J_DB_PASSWORD:claw4j}
    driver-class-name: org.postgresql.Driver

  # 迁移要在启动时真连库；默认开着的话，"没 Docker 也能起"那条承诺就没了。
  flyway:
    enabled: false

  ai:
    session:
      # 会话寿命。框架默认 null——"没配"与"永不过期"在配置上长得一样，所以必须显式写。
      # 30 天是业务口径（跨月的"上个月那批单子"还问得出来）。它只是行上的时间戳，
      # 真正把过期行删掉的是 claw4j.session.cleanup-interval 那个后台任务。
      time-to-live: 30d
      repository:
        jdbc:
          # 建表归 Flyway（claw4j-capability 的 V3）。框架那个 initializer 默认只在嵌入式库上跑，
          # 在 Postgres 上什么都不做——"以为建了其实没建"，而且它建 bean 时就要探测驱动类型。
          initialize-schema: never
    mcp:
      client:
        # 由本项目的 McpToolAutoConfiguration 接管（ADR-0002 / 0003）。框架那份会注册一个空的
        # ToolCallbackProvider（按类型注入的地方直接装配失败），两套机制还会把同一个工具收两遍。
        enabled: false

claw4j:
  # ---- 模型：一个 key 都没有就启动失败（ADR-0011，没有 mock 兜底） ----
  # 两家都配时 primary 决定谁先上，另一家是备。主家没配 key 时也启动失败，
  # 不会悄悄拿备用那家顶上——"我以为在用千问、其实还在 DeepSeek"要靠失败暴露。
  model:
    primary: ${CLAW4J_MODEL_PRIMARY:deepseek}
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
    qwen:
      base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${QWEN_API_KEY:}
      model: ${QWEN_MODEL:qwen-plus}

  # ---- 通道：谁能进来 ----
  channel:
    http:
      enabled: ${CLAW4J_HTTP_ENABLED:true}
      # 请求没带角色头时用它。给最小权限而不是拒绝：本机 curl 演示不该先去配角色。
      default-role: read-only
      # 授权表**只有这一份**，飞书也按角色名用它（见下面的 feishu.roles）。加动作只改这里。
      # 认人由通道做、授权从这里查表、Agent 只执行（ADR-0007）。actions 与工具的动作名同口径：
      #   read            读业务表，范围由 tables 决定
      #   use_skill       加载一份做法。它本身不读表，真正碰表那一步仍各自鉴权
      #   delegate_task   委派给子 Agent。委派不提权：子 Agent 用父的身份，照样过鉴权看表
      #   read_system     看 JVM/容器指标。不是业务数据，也不是"能读表的人"就该看的运维信息
      #   recall_session  读自己的历史。不复用 read："能不能回忆"与"能不能查销售单"是两件事
      #   draft_script    提交脚本草稿。只给 admin：能提议不等于能执行（run_script 是另一个动作）
      #   "*"             全部
      # 表里没有的角色一律拒绝，没有默认角色兜底。
      roles:
        read-only:
          tables: ["*"]
          actions: ["read", "use_skill", "delegate_task", "read_system", "recall_session"]
        # 表级的例子：会读，但读不到 sales_order，问成交额拿到的是明确的"没权限"
        guest:
          tables: ["region"]
          actions: ["read", "use_skill", "delegate_task"]
        admin:
          tables: ["*"]
          actions: ["*"]
    feishu:
      # 凭据齐全才装配，缺一个整个通道退让（HTTP 照常）；配了却连不上则启动失败（ADR-0009）。
      enabled: ${CLAW4J_FEISHU_ENABLED:true}
      app-id: ${FEISHU_APP_ID:}
      app-secret: ${FEISHU_APP_SECRET:}
      # 等长连接就绪的上限。少了它，"还在连"与"连不上"在日志里长得一样。
      ready-timeout: 15s
      # 这里只登记"谁是谁"（飞书 open_id），**不写 tables/actions**：授权共用上面 http 那份，
      # 角色名必须对得上，错一个就启动失败。open_id 是真实的人，填在 application-local.yml。
      roles:
        read-only:
          users: []

  # ---- 入站拦截：命中词表任意一条就整轮拒答，连模型都不调、也不进会话历史 ----
  # 词表为空时整个 Advisor 不装配——"配了但一条都没拦"与"根本没装"在容器里长得一样。
  # 这份表是自拟的：官方只给机制不给词表，通用敏感词库是内容审核用的、判据宽得多。
  # 匹配是子串 + 大小写不敏感，挡的是随口一问；有备而来的改写靠权限与数据本身兜住（ADR-0007）。
  guard:
    sensitive-words:
      # 套取系统提示词
      - "系统提示词"
      - "你的系统指令"
      - "system prompt"
      - "repeat your instructions"
      # 覆盖既有指令。写成整句而不是"忽略之前"——后者在业务对话里太常见
      #（"忽略之前的条件，按新口径算"），放进来会天天误伤。
      - "忽略之前的指令"
      - "忽略以上指令"
      - "ignore previous instructions"
      - "ignore all previous"
      - "disregard the system"
      # 提权诱导
      - "绕过权限"
      - "跳过鉴权"
      - "开发者模式"

  # ---- 记忆 ----
  session:
    # 过期会话的清理间隔。写出来是为了让人知道有这个后台任务：不写也成立
    # （@Scheduled 上的默认值同样是 PT1H），但"有一个每小时删东西的任务"不该只活在代码里。
    # 压缩阈值那几个数走代码默认值，换模型时才需要动（见 SessionMemoryProperties）。
    cleanup-interval: PT1H

  # ---- 工具检索：工具循环只有这一种，没有"要不要开"的开关，也没有"少于几个就全塞"的阈值 ----
  # 代价是工具集很小时也要多一次检索往返；收益是模型看到的行为不随工具数量改变。
  tool-search:
    # 一次检索返回几个候选（框架约定 1–10）。给多了等于把省下来的 token 又还回去一部分。
    max-results: 5

  # ---- 语义缓存：只在配了通义 key 时整套装配（向量走 text-embedding-v3，复用 qwen 凭据） ----
  # 只配 DeepSeek 的环境没有这个能力，对话照常——它是成本优化，不是依赖。
  cache:
    enabled: ${CLAW4J_CACHE_ENABLED:true}
    # 0.93 取的是"宁漏不误"那一侧：换指标（0.9154）与同义改写（0.9117~0.9501）的分数是交叠的，
    # 任何阈值都分不开，只能选往哪边错——漏了只是没省到钱，误了是给出另一个问题的答案。
    # 完整的实测表在 CacheProperties.DEFAULT_SIMILARITY_THRESHOLD 的 javadoc 里。
    similarity-threshold: ${CLAW4J_CACHE_THRESHOLD:0.93}
    # 1 小时：问的是"上周/本周"这种相对时间，答案随日历翻页而变，24 小时会在跨周一时给出上一周的。
    # 另外「上周」与「上上周」的相似度高达 0.995，比同义改写还高，单靠阈值挡不住——所以问题里的
    # 时间词与数字被编进缓存上下文键（不可配，见 CacheAdvisor#entitySignature）。
    time-to-live: PT1H
    cleanup-interval: PT1H
    embedding-model: ${QWEN_EMBEDDING_MODEL:text-embedding-v3}
    # 必须与 V4 迁移里的 vector(1024) 一致。改这个数要新写一个迁移。
    embedding-dimensions: 1024

  # ---- 能力层：配了目录才有这一层，不配就没有 ----
  # claw4j.skills.directory / claw4j.scripts.directory / claw4j.subagents.directory /
  # claw4j.generator.staging-directory（另有 review-directory / published-directory / audit-file 子键）
  # 这里刻意不给默认值：给一个默认目录就等于默认打开这一层。怎么打开见 examples/README.md。

# ---- 运维面：指标与服务端口分开 ----
# 指标里有"谁被拒了几次""花了多少 token"，和业务端口混在一起的话，"能发消息"就等于"能看运营数据"。
# 只绑本机的代价是容器里看不到——单实例本地演示是既定形态；接 Prometheus 时再改地址并同时加鉴权。
management:
  server:
    port: 9090
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        # 只开这两个。env / beans 那类会把配置与内部结构整份吐出来，
        # 它们排障有用，但那是"临时打开看一眼"的东西，不该是默认暴露面。
        include: health,metrics
  metrics:
    tags:
      # 每个指标都带这个标签：以后接了 Prometheus 或第二个服务，数据不会混在一起。
      application: claw4j
