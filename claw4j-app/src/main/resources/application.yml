spring:
  application:
    name: claw4j

  # 默认不拉容器：没有 Docker 时应用照样能启动（mock 模型 + 不连数据库）。
  # 需要数据库时加 --spring.profiles.active=local，由 Boot 拉起 compose.yaml。
  docker:
    compose:
      enabled: false

  # 默认值即可让应用在没有 Docker 时启动（Hikari 是懒连接，不会在启动时真连）。
  # 用 --spring.profiles.active=local 时由 Boot 拉起 compose.yaml 覆盖。
  datasource:
    url: ${CLAW4J_DB_URL:jdbc:postgresql://localhost:5432/claw4j}
    username: ${CLAW4J_DB_USER:claw4j}
    password: ${CLAW4J_DB_PASSWORD:claw4j}
    driver-class-name: org.postgresql.Driver
  # 默认不做迁移：迁移要在启动时真连数据库，而没有 Docker 时应用照样能起来
  # （Hikari 是懒连接，不连就不会失败）。Flyway 一开，没库就等于启动失败，
  # 那条"本地不装依赖也能跑通"的承诺就没了。需要库时用 local profile 打开。
  flyway:
    enabled: false
  data:
    redis:
      host: ${CLAW4J_REDIS_HOST:localhost}
      port: ${CLAW4J_REDIS_PORT:6379}

  # 会话建表由 Flyway 负责（tools 模块 db/migration 下的 V3）。
  # 这里把 spring-ai-session 自带的 initializer 关掉，两个理由：
  # 一是它默认只在嵌入式数据库上跑（在 Postgres 上什么都不做），
  #   于是"以为建了其实没建"，而两套初始化并存时谁先谁后又是一笔糊涂账；
  # 二是它在 bean 创建时就要连库探测驱动类型，不关掉的话"库挂了"会变成"应用起不来"。
  ai:
    session:
      repository:
        jdbc:
          initialize-schema: never

# 模型凭据一律走环境变量，不写进仓库（ADR-0002、ADR-0006）。
# 一个 key 都没有时**启动失败**（ADR-0011）：不再有 mock 兜底，
# 免得出现"本地跑着回声模型却以为在跑真模型"这种更贵的困惑。
claw4j:
  channel:
    http:
      enabled: ${CLAW4J_HTTP_ENABLED:true}
      # 角色 → 授权。认人由通道做，授权从这里查表，Agent 不参与（ADR-0007）。
      # actions 的取值与工具登记的动作名同一个口径：读是 read，
      # 有副作用的动作用自己的名字（例如 send_email），所以"只读"查得了数、发不了邮件。
      roles:
        read-only:
          tables: ["*"]
          actions: ["read"]
        # 表级的例子：会读，但读不到 sales_order，问成交额拿到的是明确的"没权限"
        guest:
          tables: ["region"]
          actions: ["read"]
        admin:
          tables: ["*"]
          actions: ["*"]
  model:
    # 主模型供应商（deepseek / qwen），另一家是备：主调用失败才退到备。
    # 主模型那家没配 key 会启动失败，不会悄悄拿备用的顶上（ADR-0006）。
    primary: ${CLAW4J_MODEL_PRIMARY:deepseek}
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
    qwen:
      base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${QWEN_API_KEY:}
      model: ${QWEN_MODEL:qwen-plus}
