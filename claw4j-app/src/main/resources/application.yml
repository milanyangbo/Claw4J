# Claw4J 的默认配置：不起数据库、不连任何外部服务也能启动。
# 要库与本地示例就用 local profile（从 application-local.yml.example 复制一份）。
#
# 三条约定：
#   - 每个 claw4j.* 键都属于某个 @ConfigurationProperties 类；为什么这么设计在 docs/design 与类的 javadoc 里。
#   - 模型与 MCP 的凭据写**句柄**：secret:<环境变量名的小写>，真值在发请求那一刻才解析，
#     配置、日志、审计、模型上下文里都只有名字。裸写明文会在启动时失败并点名是哪一行。
#   - 通道凭据（feishu / wecom / dingtalk / slack）用 ${VAR:} 占位，由 Spring 在绑定时替换。

spring:
  application:
    name: claw4j

  # 默认不拉容器、不连库：没有 Docker 的机器也能启动（连接池懒建、迁移关着）。
  docker:
    compose:
      enabled: false

  datasource:
    url: ${CLAW4J_DB_URL:jdbc:postgresql://localhost:5432/claw4j}
    username: ${CLAW4J_DB_USER:claw4j}
    password: ${CLAW4J_DB_PASSWORD:claw4j}
    driver-class-name: org.postgresql.Driver

  # 迁移要真连库，所以默认关；local profile 打开。
  flyway:
    enabled: false

  ai:
    session:
      repository:
        jdbc:
          # 建表归 Flyway（claw4j-agent 的 V3），不用框架自带的初始化。
          initialize-schema: never
    mcp:
      client:
        # MCP 客户端由本项目的 McpToolAutoConfiguration 装配：框架那份会再注册一份空清单。
        enabled: false

claw4j:
  # ---- 模型 ----
  # 两家都配时 primary 先上、另一家备用。一个 key 都没有就启动失败，没有 mock 兜底。
  model:
    primary: ${CLAW4J_MODEL_PRIMARY:deepseek}
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: secret:deepseek_api_key
      model: ${DEEPSEEK_MODEL:deepseek-chat}
    qwen:
      base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: secret:qwen_api_key
      model: ${QWEN_MODEL:qwen-plus}

    # 向量模型：语义缓存与知识库共用这一份，只跟 qwen key 走，不受任何功能开关影响。
    embedding:
      model: ${QWEN_EMBEDDING_MODEL:text-embedding-v3}
      # 必须与迁移里的 vector(1024) 一致；改这个数要同时改两处迁移。
      dimensions: 1024

  # ---- 这个部署是哪个 agent ----
  agent:
    # 人设目录：顶层每份 *.md 是一个 agent。不配就用内置的最小可用人设。
    directory: ${CLAW4J_AGENT_DIRECTORY:}
    # 目录里用哪一个。只有一份时可以不写；多份不写就启动失败并列出候选。
    default: ${CLAW4J_AGENT_DEFAULT:}
    # "今天"按哪个时区算。容器里通常是 UTC，差八小时会让晚上八点之后的"今天"变成明天。
    zone: ${CLAW4J_AGENT_ZONE:Asia/Shanghai}
    # 同一段对话串行：等上一位说完最多这么久，超时回一句"现在有点忙"。
    # 配 0 = 忙就立刻说话，不排队。
    lane-wait: 60s
    # 一轮最多调几次工具，到点就停（熔断，不改任何持久状态）。单工具 3 次不可配。
    # 它不是 token 额度——额度在会话目标上。
    tool-call-limit: 6

  # ---- 通道 ----
  # 每条通道都是"凭据齐了才装配，缺一样整份退让"（HTTP 照常跑）：只做演示的部署不该因为
  # 没配企业微信而起不来。凭据齐了却连不上，则是启动失败。
  # 下面各通道的 roles 只登记"谁是谁"；能读哪些表、能做哪些动作只有 http 那一份授权表，
  # 角色名必须与它同名，写错一个启动即失败。
  channel:
    http:
      enabled: ${CLAW4J_HTTP_ENABLED:true}
      # 请求没带角色头时用它。给最小权限而不是拒绝：本机 curl 演示不该先去配角色。
      default-role: read-only
      # 授权表只有这一份，四个通道共用。actions 与工具的动作名同口径：
      #   read            读业务表，范围由 tables 决定（知识库的伪表名是 doc）
      #   use_skill       加载一份做法；真正碰表那一步仍各自鉴权
      #   delegate_task   委派子 Agent：用父的身份，不提权
      #   read_system     看 JVM / 容器指标
      #   recall_session  读自己的历史会话
      #   get_goal / create_goal / update_goal   会话目标的读与写（暂停、清除归人）
      #   schedule_task / list_schedules / cancel_schedule   自己的定时任务
      #   draft_script    提交脚本草稿（只给 admin）；执行脚本是另一个动作 run_script
      #   exec_command    跑通用 shell 命令（只给 admin）
      #   "*"             全部
      # 表里没有的角色一律拒绝，没有默认兜底。
      roles:
        # "*" 也包含知识库那个伪表 doc，所以 read-only 能检索知识库。
        read-only:
          tables: ["*"]
          actions: ["read", "use_skill", "delegate_task", "read_system", "recall_session",
                    "get_goal", "create_goal", "update_goal",
                    "schedule_task", "list_schedules", "cancel_schedule"]
        # 表级的例子：会读，但读不到 sales_order，问成交额拿到的是明确的"没权限"。
        # 它只给了 region，于是也看不到知识库——想给就加 doc。
        guest:
          tables: ["region"]
          actions: ["read", "use_skill", "delegate_task"]
        admin:
          tables: ["*"]
          actions: ["*"]

    # 飞书：长连接接消息，凭据是 app-id + app-secret。
    feishu:
      enabled: ${CLAW4J_FEISHU_ENABLED:true}
      app-id: ${FEISHU_APP_ID:}
      app-secret: ${FEISHU_APP_SECRET:}
      # 等长连接就绪的上限。少了它，"还在连"与"连不上"在日志里长得一样。
      ready-timeout: 15s
      roles:
        read-only:
          users: []          # 填 open_id

    # 企业微信：公网回调 /api/wecom/callback，五样齐了才装配。
    # 后台"接收消息"那页的 Token 与 EncodingAESKey 必须与这里一致，错一个的表现都是
    # 回调静默失败、用户永远等不到回答。
    wecom:
      enabled: ${CLAW4J_WECOM_ENABLED:true}
      corp-id: ${WECOM_CORP_ID:}
      corp-secret: ${WECOM_CORP_SECRET:}
      # 数字；缺省 0 表示没配（装配条件因此不成立，而不是拿 0 去发消息）
      agent-id: ${WECOM_AGENT_ID:0}
      token: ${WECOM_TOKEN:}
      encoding-aes-key: ${WECOM_ENCODING_AES_KEY:}
      roles:
        read-only:
          users: []          # 填成员 UserID

    # 钉钉：公网回调 /api/dingtalk/callback，报文是明文 JSON、验签在 header 里。
    # client-secret 同时干两件事——换 token 与验签：配错它既有"发不出去"也有"所有回调被拒"。
    dingtalk:
      enabled: ${CLAW4J_DINGTALK_ENABLED:true}
      client-id: ${DINGTALK_CLIENT_ID:}
      client-secret: ${DINGTALK_CLIENT_SECRET:}
      # 通常与 Client ID 同值，但独立配置：换机器人不必换应用凭据。
      robot-code: ${DINGTALK_ROBOT_CODE:}
      # 没有默认角色：机器人没发布上线时钉钉不返回 senderStaffId，那种情况只记一条 WARN。
      roles:
        read-only:
          users: []          # 填企业内 userId

    # Slack：Events API 回调 /api/slack/events，签名覆盖整个原始报文、时间戳单位是秒。
    # 后台要同时订阅 app_mention 与 message.im（私聊不走 app_mention）。
    # 两把凭据各管一头：signing-secret 只验签，bot-token（xoxb-）只发消息。
    slack:
      enabled: ${CLAW4J_SLACK_ENABLED:true}
      signing-secret: ${SLACK_SIGNING_SECRET:}
      bot-token: ${SLACK_BOT_TOKEN:}
      # 同频道两条消息的最小间隔（chat.postMessage 限流）。调小不会更快，只会撞 429。
      min-interval: 1s
      roles:
        read-only:
          users: []          # 填 Slack user id（U 开头）

  # ---- 入站拦截 ----
  # 命中词表任意一条就整轮拒答：不调模型、也不进会话历史。词表为空时整个拦截不装配。
  # 匹配是子串 + 大小写不敏感，挡的是随口一问；有备而来的改写靠权限与数据本身兜住。
  guard:
    sensitive-words:
      # 套取系统提示词
      - "系统提示词"
      - "你的系统指令"
      - "system prompt"
      - "repeat your instructions"
      # 覆盖既有指令。写成整句而不是"忽略之前"——后者在业务对话里太常见
      #（"忽略之前的条件，按新口径算"），放进来会天天误伤。
      - "忽略之前的指令"
      - "忽略以上指令"
      - "ignore previous instructions"
      - "ignore all previous"
      - "disregard the system"
      # 提权诱导
      - "绕过权限"
      - "跳过鉴权"
      - "开发者模式"

  # ---- 记忆与一段对话的边界 ----
  session:
    # 私聊的边界。
    #   main（默认）          一个人的所有私聊共用一个主会话。
    #   per-peer              按对端身份分（同一个人跨通道共用）。
    #   per-channel-peer      按通道 + 对端分，换一条通道就是另一段。
    #   per-account-channel-peer  本仓库没有 account 这一维，等同 per-channel-peer。
    # **多人可及的部署必须改成 per-channel-peer**：main 意味着网页里问到的数字，
    # 飞书私聊里的模型也看得见。
    dm-scope: main
    # 群聊的边界：per-group（默认）按群隔离；main 把群并进主会话。
    group-scope: per-group
    # 会话表落在哪个 schema，默认与业务数据的 business 分开。
    # 改它会影响五处（框架那一路、会话指针、会话目标、清理、跨会话召回），都由这一个键取。
    # schema: claw4j_session
    # 过期会话的清理间隔。这是"确实有一个每小时删东西的后台任务"的说明。
    cleanup-interval: PT1H
    # 主模型的上下文窗口（token）。压缩阈值是它的 0.5 倍，比例与保留条数不做配置。
    # 换主模型就改这一行，不用翻代码。
    context-window: 65536
    # 旧会话怎么清。
    maintenance:
      # enforce（默认）真删；warn 只算不删，把"本来会删多少"打进日志与指标。
      mode: enforce
      # 多久**没动**算陈旧（不是"建了多久"）。
      prune-after: 30d
      # 节点数上限。单用户形态的数：多租户要按"人数 × 通道数"调大，
      # 否则到上限被驱逐的是"最久没动的那个"，与他做了什么无关。
      max-entries: 5000
    # 换段 = 换对话：记忆、预算、召回都从零开始。
    reset:
      # none（默认）不自动结束，靠上下文压缩管长度；daily-and-idle 跨天或空闲；
      # idle 只看空闲。三档下 /new 都有效。
      mode: none
      # 逻辑日的分界点：4 点的意思是"凌晨三点还在聊的那件事还是昨天那件"。
      # 时区取 claw4j.agent.zone，不取容器时区。
      at-hour: 4
      # 多久没动静算结束。OpenClaw 的 idleMinutes 默认也是 120。
      idle-minutes: 120

  # ---- 需要库的几样：审计、审批、投递配置、定时任务 ----
  # 关掉之后判了不留痕、批了查不到、到点没人跑。迁移默认关着，所以这一层默认开。
  persistence:
    enabled: true

  # ---- 审批 ----
  approval:
    # 一条请求等人等多久。太短则审批人开个会回来卡片已作废；太长则三天前的上下文还能放行。
    ttl: 10m
    # 谁能批：飞书那边填 open_id，HTTP 那边填用户名（X-Claw4j-User）。
    # 与 roles 是两张表：那个回答"能读哪些表"，这个回答"愿意为别人的操作负责"。
    # 空 = 没人能批（请求会挂到过期，启动日志有一条 WARN）。
    approvers: []

  # ---- 定时任务：到点 = 创建一个 run ----
  schedule:
    # 关掉之后扫描与那三个工具一起不装配（已建的任务照旧保留，重新打开即恢复）。
    enabled: true
    # 扫表间隔。写 0 会让调度退化成热循环，所以非法值直接拒绝启动。
    scan-interval: PT30S
    # 一次扫描最多认领几条，逐条串行跑完再看下一轮。调大等于同一时刻有 N 个模型在烧不同人的额度。
    max-per-scan: 5
    # 连续几次没跑成就自动停用并推一条带最后错误的通知（成功一次清零）。
    # 只对"可能是暂时的"失败计数：权限被收回那类当场停用。
    failure-threshold: 3
    # 一条被认领之后占多久：管的是"认领之后进程崩了"，否则它会一直躺在"已认领"里没人再跑。
    lease: PT5M
    # 一次定时运行留下的会话留多久。定时任务一次运行一个新段，按 30 天留会撑满会话表。
    session-retention: PT24H

  # ---- 审计：一行 = 一次动作的开始或结束 ----
  audit:
    # 记不记新事件。关掉之后不再写新的，已有记录照常可查。
    enabled: true
    # 清理间隔（启动时也清一次，另外每 500 次写入清一次）。
    prune-interval: PT1H

  # ---- 工具检索：工具循环只有这一种，没有开关，也没有"少于几个就全塞"的阈值 ----
  tool-search:
    # 一次检索返回几个候选（框架约定 1–10）。给多了等于把省下来的 token 又还回去。
    max-results: 5

  # ---- 工具档位 ----
  # 四档累进：minimal < messaging < coding < full。工具声明它最低需要哪一档，
  # 声明档位高于 profile 的工具不进清单，检索也检索不到。默认 full = 升级前后一样。
  tools:
    profile: ${CLAW4J_TOOLS_PROFILE:full}
    # 白名单，只能收窄、不能越过 profile（否则它就是绕过档位的口子）。
    allow: []
    # 黑名单，在档位与白名单之后生效。同一个名字写进 allow 与 deny 会启动失败；
    # 写了不存在的名字不报错，但启动日志会列出来（拼错也长这样）。
    deny: []

    # ---- 通用 shell ----
    # 工具是 Spring AI 的 Bash / BashOutput / KillShell，边界在后端里。
    #   deny       不装配
    #   allowlist  只跑白名单里的命令
    #   ask        白名单命中也要人先批
    #   full       不判白名单、不批（默认）
    # **安全位不在 mode 上，在授权表上**：exec_command 默认只给 admin。
    # 参数只有 command / timeout / description / runInBackground，没有 workdir 与 env：
    # 目录固定是下面的 workspace（要换就 cd），要临时改变量就写 FOO=bar cmd。
    exec:
      mode: ${CLAW4J_EXEC_MODE:full}
      # 默认是进程的工作目录；填了就必须是已存在的目录，否则启动失败。
      workspace: ${CLAW4J_EXEC_WORKSPACE:.}
      # 白名单：整条命令等于某一项、或以"某一项 + 空格"开头，且命令里不许有
      # shell 控制符（; | & > < ` $( 换行）。要管道就用 ask 或 full。
      allow: []

    # ---- 会话可见性：recall_session 能看见哪些会话 ----
    #   self   只有当前这一段
    #   tree   当前 + 它派生的子 Agent 会话
    #   agent  本 agent 的全部会话
    #   all    全部会话，含其他用户的（默认）
    # **多用户、角色不同的部署必须配 self**：默认 all 意味着 read-only 能召回别人的会话内容。
    # 写错词（everybody）启动失败并点名四个合法值。
    sessions:
      visibility: ${CLAW4J_SESSION_VISIBILITY:all}

  # ---- 把自己当 MCP server 交出去 ----
  # 默认关。开了之后在标准输入输出上说 MCP，Claude Code 这类客户端可以把这里的工具当自己的用。
  # stdio 的硬约束：stdout 是协议通道，一个字节的日志都不能往那去——用 application-mcp-stdio.yml 起。
  mcp:
    server:
      # 开着却一个都不交是启动失败：客户端连得上、握手成功、拿到空清单，看起来像 server 坏了。
      enabled: ${CLAW4J_MCP_SERVER_ENABLED:false}
      # 交出去哪几个工具（只能是模型能用的那一份里的，档位与 allow/deny 照常生效）。
      expose: []
      # 外部客户端能读的表，与 channel.http.roles 无关：客户端没有 IM 身份。
      tables: ["*"]

  # ---- 语义缓存：只在配了通义 key 时装配 ----
  # 命中即返回上次的回答，这一轮不调模型。它默认是强依赖：索引在启动时建，连不上就启动失败。
  cache:
    enabled: ${CLAW4J_CACHE_ENABLED:true}
    # 0.93 取的是"宁漏不误"那一侧：换指标与同义改写的分数是交叠的，漏了只是没省到钱。
    similarity-threshold: ${CLAW4J_CACHE_THRESHOLD:0.93}
    # 必须 Redis Stack（RediSearch + RedisJSON），普通 Redis 建不出向量索引。
    redis-uri: ${CLAW4J_CACHE_REDIS_URI:redis://127.0.0.1:6379}

  # ---- 知识库检索：向量 + 关键词两路，结果带出处 ----
  # 默认关：它要一份文档目录与一次 embedding 调用。开着就必须能用——缺目录、目录空、
  # embedding 算不出来都是启动失败，不给你一个"每次都说没有相关资料"的空库。
  rag:
    enabled: ${CLAW4J_RAG_ENABLED:false}
    # 文档目录，递归找 .md / .txt。启动后同步一次，按内容哈希跳过没变的；文件删了块也跟着删。
    directory: ${CLAW4J_RAG_DIRECTORY:}
    # 最终注入几段（在链路最后截断），与下面"每路召回多少"是两件事。
    top-k: ${CLAW4J_RAG_TOP_K:5}
    # 相似度下限，只负责把明显不相关的挡掉。调它之前先攒一批真实问题。
    min-similarity: ${CLAW4J_RAG_MIN_SIMILARITY:0.5}
    # 一块文档多少 **token**（不是字符），切块交给框架的 TokenTextSplitter。
    chunk-size: 800

    # 混合检索：向量 + 全文（`content ilike '%q%'`，GIN trgm 加速）加权 0.7 / 0.3。
    hybrid:
      # 关掉只剩向量：`SKU-2024` 这类"字面精确、语义无关"的查询会退化。
      enabled: ${CLAW4J_RAG_HYBRID_ENABLED:true}
      # 每路各召回多少条。必须比 top-k 大，否则"两路都命中"根本发生不了。
      candidates-per-route: ${CLAW4J_RAG_CANDIDATES_PER_ROUTE:15}

    # 重排：通义 qwen3-rerank，走 OpenAI 兼容端点。
    rerank:
      enabled: ${CLAW4J_RAG_RERANK_ENABLED:true}
      # 送进重排的条数（输入上限）。重排只换顺序、不截断，"最终留几段"由上头的 top-k 决定。
      candidates: ${CLAW4J_RAG_RERANK_CANDIDATES:10}
      # **是 compatible-api 不是 compatible-mode**：与 chat / embedding 不是同一个前缀，
      # 所以单独配，不从 qwen 的 base-url 拼。
      base-url: ${CLAW4J_RAG_RERANK_BASE_URL:https://dashscope.aliyuncs.com/compatible-api/v1}
      model: ${CLAW4J_RAG_RERANK_MODEL:qwen3-rerank}
      # 挂在每轮检索路径上，用户等的是首字延迟。超时或 4xx/5xx 一律按候选原顺序继续。
      timeout: 2s
      # 凭据复用 claw4j.model.qwen.api-key，不引第二把钥匙。

  # ---- 观测：trace 走 OTLP，默认一段都不导 ----
  # 关着时容器里没有 provider、没有 exporter，也不起线程。
  # 开了却没配 endpoint 时一条也不导，启动日志点名缺哪一项（不回落 localhost:4318）。
  # 指标仍走下面 management 那套，trace 只走 OTLP。
  observability:
    enabled: ${CLAW4J_OBSERVABILITY_ENABLED:false}
    # OTLP **HTTP** 的地址，例如 http://localhost:4318（带 /v1/traces 也认）。不走 gRPC。
    endpoint: ${OTLP_ENDPOINT:}
    service-name: ${OTEL_SERVICE_NAME:claw4j}
    # 采样比例。实现是 ParentBased(TraceIdRatioBased)：裸比例会出现"有 run、没有 tool"。
    sample-ratio: 1.0
    # 单次导出超时。collector 不在同机时留一次重试的余量。
    timeout: PT10S
    # batch 队列上限，满了会丢（丢的时候 OTel 自己打日志）。
    max-queue-size: 2048

  # ---- 能力层：配了目录才有，不配就没有 ----
  # claw4j.scripts.directory / claw4j.skills.directory / claw4j.subagents.directory / claw4j.rag.directory
  # 这里不给默认值：给一个默认目录就等于默认打开这一层。怎么开见 README-adding-capabilities.md。

# ---- 运维面：指标与服务端口分开 ----
# 指标里有"谁被拒了几次""花了多少 token"，与业务端口混在一起的话，"能发消息"就等于"能看运营数据"。
# 只绑本机；接 Prometheus 时再改地址并同时加鉴权。
management:
  server:
    port: 9090
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        # 只开这两个。env / beans 那类会把配置与内部结构整份吐出来，要用时临时打开。
        include: health,metrics
  metrics:
    tags:
      # 每个指标都带这个标签：以后接了第二个服务，数据不会混在一起。
      application: claw4j
