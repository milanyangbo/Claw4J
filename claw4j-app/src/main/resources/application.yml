# Claw4J 默认配置：不装数据库也能启动。模型凭据必须配，一个都没有会启动失败。
# 想本地带库、示例与全部能力，用 local profile（照着 application-local.yml.example 复制一份）。
#
# 凭据两种写法：
#   模型 / MCP  写句柄 secret:<环境变量名的小写>。真值在发请求那一刻才读，配置与日志里只有名字；
#               裸写明文会在启动时被拒，并指出是哪一行。
#   通道        用 ${VAR:} 占位，由 Spring 在启动时替换。

spring:
  application:
    name: claw4j

  # 默认不拉容器：没有 Docker 的机器也要能起。
  docker:
    compose:
      enabled: false

  datasource:
    url: ${CLAW4J_DB_URL:jdbc:postgresql://localhost:5432/claw4j}
    username: ${CLAW4J_DB_USER:claw4j}
    password: ${CLAW4J_DB_PASSWORD:claw4j}
    driver-class-name: org.postgresql.Driver

  # 迁移要真连库，默认关；local profile 打开。
  flyway:
    enabled: false

  ai:
    session:
      repository:
        jdbc:
          # 建表交给 Flyway，不用框架自带的初始化。
          initialize-schema: never
    mcp:
      client:
        # MCP 客户端由本项目装配；打开框架这份会多注册一个空清单。
        enabled: false

claw4j:
  # ---- 模型 ----
  # primary 先用，另一个兜底。两家都配就自动容灾；一个 key 都没有则启动失败。
  model:
    primary: ${CLAW4J_MODEL_PRIMARY:deepseek}
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: secret:deepseek_api_key
      model: ${DEEPSEEK_MODEL:deepseek-chat}
    qwen:
      base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: secret:qwen_api_key
      model: ${QWEN_MODEL:qwen-plus}

    # 向量模型：语义缓存与知识库共用这一份，只跟 qwen key 走。
    embedding:
      model: ${QWEN_EMBEDDING_MODEL:text-embedding-v3}
      # 必须与数据库里的 vector(1024) 一致；改它要同时改两处迁移。
      dimensions: 1024

  # ---- 这个部署是哪个 agent（人设）----
  agent:
    # 人设目录：顶层每份 *.md 是一个 agent。不配就用内置的最小人设。
    directory: ${CLAW4J_AGENT_DIRECTORY:}
    # 用目录里的哪一份。只有一份时可以不写；多份不写会启动失败并列出候选。
    default: ${CLAW4J_AGENT_DEFAULT:}
    # "今天"按哪个时区算。容器默认 UTC，差八小时会让晚上八点后的"今天"变成明天。
    zone: ${CLAW4J_AGENT_ZONE:Asia/Shanghai}
    # 同一段对话排队：等上一位说完最多这么久，超时回一句"现在有点忙"。0 = 不排队。
    lane-wait: 60s
    # 一轮最多调几次工具，到点就停。它是熔断，不是 token 额度。
    tool-call-limit: 6
    # 一轮最多跑多久，到点回一句说明并结束。工具次数管不住"某一次调用卡住"，由这条兜底。
    # 0 = 不设上限（长任务才这么配）。
    turn-timeout: 10m

  # ---- 通道 ----
  # 凭据齐了才装配，缺一样整份跳过（HTTP 照常跑）；配了却连不上，启动失败。
  # 每个通道都有一份准入名单：空 = 谁都不能。忘了配的后果是"打不开"，不是"公网可调"。
  channel:
    http:
      enabled: ${CLAW4J_HTTP_ENABLED:true}
      # 网关认证后会写 X-Claw4j-User，这里再筛一遍。本机 curl 演示先把自己填进来；
      # 写 ["*"] 表示不设准入。
      users: []
    # 飞书：长连接收消息，凭据是 app-id + app-secret。
    feishu:
      enabled: ${CLAW4J_FEISHU_ENABLED:true}
      app-id: ${FEISHU_APP_ID:}
      app-secret: ${FEISHU_APP_SECRET:}
      # 等长连接就绪的上限。有了它，"还在连"与"连不上"才能区分开。
      ready-timeout: 15s
      # 填 open_id：从那条"未登记"的 WARN 里抄 sender=ou_...
      users: []
    # 企业微信：公网回调 /api/wecom/callback，五样齐了才装配。
    # 后台"接收消息"页的 Token 与 EncodingAESKey 必须与这里一致，错一个都是回调静默失败。
    wecom:
      enabled: ${CLAW4J_WECOM_ENABLED:true}
      corp-id: ${WECOM_CORP_ID:}
      corp-secret: ${WECOM_CORP_SECRET:}
      # 数字。0 = 没配（装配条件不成立，而不是拿 0 去发消息）。
      agent-id: ${WECOM_AGENT_ID:0}
      token: ${WECOM_TOKEN:}
      encoding-aes-key: ${WECOM_ENCODING_AES_KEY:}
      # 填成员 UserID
      users: []
    # 钉钉：公网回调，报文是明文 JSON，验签在 header 里。
    dingtalk:
      enabled: ${CLAW4J_DINGTALK_ENABLED:true}
      client-id: ${DINGTALK_CLIENT_ID:}
      # 一个值干两件事：换 token、验签。配错会同时"发不出去"和"回调全被拒"。
      client-secret: ${DINGTALK_CLIENT_SECRET:}
      # 通常与 Client ID 同值；独立配置是为了换机器人不必换应用凭据。
      robot-code: ${DINGTALK_ROBOT_CODE:}
      # 填企业内 userId。机器人没发布上线时钉钉不给 senderStaffId，那种情况只记一条 WARN。
      users: []
    # Slack：Events API 回调。后台要同时订阅 app_mention 与 message.im（私聊不走前者）。
    slack:
      enabled: ${CLAW4J_SLACK_ENABLED:true}
      # 只验签，不发送。
      signing-secret: ${SLACK_SIGNING_SECRET:}
      # 只发送（xoxb-），不验签。
      bot-token: ${SLACK_BOT_TOKEN:}
      # 同频道两条消息的最小间隔。调小不会更快，只会撞限流 429。
      min-interval: 1s
      # 填 Slack user id（U 开头）
      users: []

  # ---- 入站拦截 ----
  # 命中词表任意一条就整轮拒答：不调模型、也不写进会话历史。按子串匹配，忽略大小写。
  guard:
    # 一行一个词，# 开头是注释。相对路径按启动目录解析。
    # 配了文件却不存在会启动失败——"什么都没拦"和"拦住了"在日志上长得一样。
    sensitive-words-file: ${CLAW4J_GUARD_WORDS_FILE:examples/guard/sensitive-words.txt}
    # 命中时回给用户的话。别写命中了哪个词，那等于把词表告诉想绕过的人。
    # failure-response: 这条消息我没法处理，换个说法再试一次。

  # ---- 一段对话的边界与长度 ----
  session:
    # 私聊怎么分段：
    #   main（默认）  一个人所有私聊共用一个主会话
    #   per-peer      按对端分，同一个人跨通道共用
    #   per-channel-peer  按通道 + 对端分，换通道就是另一段
    # **多人可及的部署必须改成 per-channel-peer**：否则网页里问到的数字，飞书私聊里也看得见。
    dm-scope: main
    # 群聊：per-group（默认）按群隔离；main 把群并进主会话。
    group-scope: per-group
    # 会话表放哪个 schema。五处都读这一个键（框架那一路、会话指针、会话目标、清理、召回），
    # 所以改一处就够，但五处会一起变。
    # schema: claw4j_session
    # 多久清一次过期会话（后台任务）。
    cleanup-interval: PT1H
    # 主模型的上下文窗口（token）。用到一半就开始压缩。换模型只改这一行。
    context-window: 65536
    # 旧会话怎么清。
    maintenance:
      # enforce 真删；warn 只算不删，把"本来会删多少"打进日志与指标。
      mode: enforce
      # 多久没动算陈旧（不是建了多久）。
      prune-after: 30d
      # 会话节点数上限。多租户要按"人数 × 通道数"调大，否则到上限被赶走的是最久没动的那个。
      max-entries: 5000
    # 换段 = 换对话：记忆、预算、召回都从零开始。
    reset:
      # none（默认）不自动结束，靠压缩管长度；daily-and-idle 跨天或空闲；
      # idle 只看空闲。三档下 /new 都有效。
      mode: none
      # 一天从几点算起。4 点的意思是"凌晨三点还在聊的那件事还是昨天那件"。
      # 时区取上面的 agent.zone。
      at-hour: 4
      # 多久没动静算这段结束（分钟）。
      idle-minutes: 120

  # ---- 需要库的几样：审计、审批、投递、定时任务 ----
  # 关掉之后：判了不留痕、批了查不到、到点没人跑。
  persistence:
    enabled: true

  # ---- 审批：执行前等人点头 ----
  approval:
    # 一条请求等人等多久。太短，审批人开个会回来卡片已作废；太长，三天前的上下文还能放行。
    ttl: 10m
    # 谁能批：飞书填 open_id，HTTP 填用户名。
    # 与准入名单是两回事：那个管"能不能用这条通道"，这个管"愿不愿意为别人的操作负责"。
    # 空 = 没人能批，待批请求会挂到过期（启动日志有一条 WARN）。
    approvers: []

  # ---- 定时任务：到点创建一个 run ----
  schedule:
    # 关掉后扫描与那三个工具一起不装配；已建的任务保留，重新打开即恢复。
    enabled: true
    # 多久扫一次。写 0 会变成热循环，所以非法值直接拒绝启动。
    scan-interval: PT30S
    # 一次最多认领几条，逐条串行跑完再看下一轮。调大等于同一时刻有 N 个模型在烧不同人的额度。
    max-per-scan: 5
    # 连续几次跑不成就自动停用，并推一条带最后错误的通知（成功一次清零）。
    # 只对"可能是暂时的"失败计数；权限被收回那类当场停用。
    failure-threshold: 3
    # 一条被认领后占多久。管的是"认领之后进程崩了"，否则它会一直躺在"已认领"里没人再跑。
    lease: PT5M
    # 一次定时运行的会话留多久。每次运行一个新段，按 30 天留会撑满会话表。
    session-retention: PT24H

  # ---- 审计：一行 = 一次动作的开始或结束 ----
  audit:
    # 关掉之后不再写新事件，已有记录照常可查。
    enabled: true
    # 清理间隔（启动时清一次，之后每 500 次写入再清一次）。
    prune-interval: PT1H

  # ---- 工具检索：模型不是一次拿到全部工具，而是按关键词检索 ----
  tool-search:
    # 一次返回几个候选（1–10）。给多了等于把省下的 token 又还回去。
    max-results: 5

  # ---- 工具清单：这个部署让模型看见哪些工具 ----
  # 四档是四个独立的集合，不是"一级比一级全"：
  #   minimal    地基：检索、问人、读自己状态、回忆本会话、记计划
  #   messaging  能问能查、碰不到机器：地基 + 业务模块与 MCP
  #   coding     开发助手：能跑命令、改文件、出网，还有定时任务、子 Agent、技能
  #   full       不限（默认；升级前后清单一样）
  tools:
    profile: ${CLAW4J_TOOLS_PROFILE:full}
    # 白名单：只能在所选画像之内收窄（画像就是上面四档之一）。写了画像里没有的工具不生效，
    # 启动日志会告警。
    # 支持简写 group:*（group:fs / group:runtime / group:web / group:agents /
    # group:plugins / group:openclaw）。
    allow: []
    # 显式放宽：可以突破画像。"messaging 画像但要跑一条命令"写 [Bash] 就够，
    # 不必把整个部署调成 coding 再 deny 一大串。
    alsoAllow: []
    # 黑名单：最后生效，压过 allow 与 alsoAllow。
    # 同一个名字既在 allow 又在 deny 会启动失败；写了不存在的名字不报错，但启动日志会列出来。
    deny: []

    # ---- 按维度收窄（都可以不配，不配就没有这一层）----
    # 每轮按"这一轮谁在问、用的哪个模型"现算，只能在上面的结果上继续减。
    #
    # 按模型：键可以是 provider，也可以是 provider/model（后者更精确，先命中）。
    #   byProvider:
    #     deepseek:                 # 这个供应商的所有模型
    #       profile: messaging
    #       deny: [group:runtime]
    #     deepseek/deepseek-chat:   # 只对这一个模型
    #       allow: [querySales]
    byProvider: {}
    #
    # 按发送者：键是 "channel:<通道>:<userId>"、"id:<userId>"，或 "*" 兜底。
    # 命中即用，不合并——写了一条 * 的兜底 deny 之后，给某个人单独 allow 仍然放得开。
    # 含冒号的键必须加引号，否则 YAML 会当成嵌套。
    #   toolsBySender:
    #     "channel:feishu:alice": { allow: [querySales] }
    #     "id:bob":               { deny: [group:runtime] }
    #     "*":                    { deny: [group:runtime] }
    toolsBySender: {}
    #
    # 子 Agent 能看到什么：在这里继续收窄。内建清单是"定时任务三件套不给子 Agent"；
    # 被 allow 点名的工具不受内建清单限制。
    #   subagents:
    #     allow: []
    #     deny: []
    subagents:
      allow: []
      deny: []

    # ---- 跑命令（Bash）：安不安全、要不要人批 ----
    # 审批不是装配时定的，是每次执行前按三段算：security × ask × 命令分析。
    #   mode 是预设，一次给三段赋值；写了显式字段就覆盖那一段。
    #     deny      不装配
    #     allowlist 只跑白名单，未命中直接拒（不给人点按钮的机会）
    #     ask       白名单命中就跑，未命中问人
    #     auto      同上，但未命中先问复核器；没有复核器时等同 ask
    #     full      不判白名单、不批（默认）
    exec:
      mode: ${CLAW4J_EXEC_MODE:full}
      # 在哪台机器上跑：auto / gateway / sandbox / node。
      # 本应用既是控制面也是执行面，所以 auto 与 gateway 都是本机。
      # sandbox 要容器，node 要多宿主（都没有）——配了会启动失败，不静默回落。
      # host: auto
      # 三段式的显式字段：不写取 mode 预设，写了覆盖那一段。
      # security: allowlist
      # ask: on-miss            # off / on-miss / always
      # autoReview: false
      # 命令在哪个目录跑。默认是启动时的目录（记在 claw4j.launch-directory）。
      # 别写 "."：内嵌 Tomcat 起来会把 user.dir 改成它的 docbase，"." 就指向别处了。
      workspace: ${CLAW4J_EXEC_WORKSPACE:${claw4j.launch-directory:.}}
      # 白名单：整条命令等于某一项、或以"某一项 + 空格"开头。
      # 批过"以后都放行"的命令会进数据库，与这份按同一规则合并匹配。
      allow: []

    # ---- 提权：会话里临时放宽（/elevated）----
    # off（默认）按 sandbox 与 exec 的配置跑，审批照常。
    # on / ask：这一段跑到沙箱外，审批照旧。
    # full：这一段跳过审批。只在当前这段对话里有效，重启即失效。
    # 名单空 = 谁都不许：权限这件事上"没配"只能是"不许"。
    elevated:
      enabled: ${CLAW4J_ELEVATED_ENABLED:false}
      allow-from: []
      # 一次提权多久失效。到点自动回到 off，忘了关也不会变成永久。
      ttl: 30m

    # ---- 沙箱：命令跑在宿主里，还是跑在容器里 ----
    # 默认 off，与没有这一层时逐字节一致。打开后命令进容器。
    # 探不通 docker 会启动失败，不会悄悄回落到宿主——那样你以为有隔离，其实没有。
    # 执行完全交给库（托管容器、后台句柄、超时杀 PID、退出回收）。
    sandbox:
      # off / all。non-main（"主对话留宿主、其余进容器"）还没接上，配了启动失败。
      # 要与 exec.host 对得上：host=sandbox 而这里 off，启动即失败。
      mode: ${CLAW4J_SANDBOX_MODE:off}
      # docker；ssh 还没实现，配了启动失败（留一个配了不生效的取值更坏）。
      backend: ${CLAW4J_SANDBOX_BACKEND:docker}
      # ro / rw / none。目前不生效：挂载由库管理，只支持读写。配了会在启动日志里说明。
      workspace-access: ${CLAW4J_SANDBOX_WORKSPACE_ACCESS:ro}
      # 镜像要带 POSIX shell；还要 sleep（托管容器靠它保活）与可写的 /tmp（记 PID）。
      image: ${CLAW4J_SANDBOX_IMAGE:alpine:3}
      docker-binary: ${CLAW4J_SANDBOX_DOCKER_BINARY:docker}
      # 沙箱会话里给哪些工具：只在 mode≠off 时生效。
      # bundle-mcp 是组名：不写它，沙箱会话里就看不见任何 MCP 工具（默认关）。
      tools:
        allow: []
        deny: []
        also-allow: []

    # ---- 读写文件（Read / Grep / Glob，可选 Write / Edit）----
    # 读与搜默认就有，路径只能落在 directory 里（`..` 和软链接跳出去会被拒）。
    # 写要单独开：能改磁盘意味着一次误判就是一次脏工作区。
    files:
      # 同 exec：默认是启动时的目录，别写 "."。
      directory: ${CLAW4J_FILES_DIRECTORY:${claw4j.launch-directory:.}}
      write-enabled: ${CLAW4J_FILES_WRITE_ENABLED:false}

    # ---- 联网：WebFetch（不要 key）与 WebSearch（要 key）----
    # 搜索没 key 就不装配，不做"装了但调不通"。
    web:
      search-api-key: ${BRAVE_API_KEY:}

    # ---- 反问用户：同一轮里问一句、等人答，再往下走 ----
    # IM 把问题推进这段对话；HTTP 挂起请求，客户端查 /api/chat/questions 再提交答案。
    # 等不到就按"没答"继续，不重复问。超时秒数会被钳在 30–3600。
    ask:
      enabled: ${CLAW4J_ASK_ENABLED:true}
      timeout-seconds: ${CLAW4J_ASK_TIMEOUT_SECONDS:900}

    # ---- 回忆会话：recall_session 能翻到哪些对话 ----
    #   self   只有当前这一段
    #   tree   当前 + 它派生的子 Agent
    #   agent  本 agent 的全部会话
    #   all    全部，含别人的（默认）
    # **多用户部署必须配 self**：默认 all 意味着只读账号也能召回别人的会话内容。
    sessions:
      visibility: ${CLAW4J_SESSION_VISIBILITY:all}

  # ---- 语义缓存：问过的问题不再花第二次钱 ----
  # 命中就返回上次的回答，这一轮不调模型。配了通义 key 才装配。
  # 它是强依赖：索引在启动时建，连不上就启动失败。
  cache:
    enabled: ${CLAW4J_CACHE_ENABLED:true}
    # 0.93 取的是"宁漏不误"：漏了只是没省到钱，误了会答错。
    similarity-threshold: ${CLAW4J_CACHE_THRESHOLD:0.93}
    # 必须 Redis Stack（带向量检索），普通 Redis 建不出索引。
    redis-uri: ${CLAW4J_CACHE_REDIS_URI:redis://127.0.0.1:6379}

  # ---- 知识库：按文档回答问题，答案带出处 ----
  # 默认关：它要一份文档目录和一次 embedding 调用。开着就必须能用——
  # 缺目录、目录空、算不出向量都是启动失败，不给你一个"每次都说没有资料"的空库。
  rag:
    enabled: ${CLAW4J_RAG_ENABLED:false}
    # 文档目录，递归找 .md / .txt。启动后同步一次，按内容哈希跳过没变的；文件删了块跟着删。
    directory: ${CLAW4J_RAG_DIRECTORY:}
    # 最终给模型几段（最后一步截断），与下面"每路召回多少"是两件事。
    top-k: ${CLAW4J_RAG_TOP_K:5}
    # 相似度下限，只负责挡掉明显不相关的。调它之前先攒一批真实问题。
    min-similarity: ${CLAW4J_RAG_MIN_SIMILARITY:0.5}
    # 一块文档多少 token（不是字符）。
    chunk-size: 800

    # 混合检索：向量 + 关键词（0.7 / 0.3）。
    hybrid:
      # 关掉只剩向量：`SKU-2024` 这种"字面精确、语义无关"的查询会退化。
      enabled: ${CLAW4J_RAG_HYBRID_ENABLED:true}
      # 每路各召回多少。必须比 top-k 大，否则"两路都命中"根本发生不了。
      candidates-per-route: ${CLAW4J_RAG_CANDIDATES_PER_ROUTE:15}

    # 重排（qwen3-rerank）：只换顺序，不删结果。
    rerank:
      enabled: ${CLAW4J_RAG_RERANK_ENABLED:true}
      # 送进重排的条数。最终留几段由上面的 top-k 决定。
      candidates: ${CLAW4J_RAG_RERANK_CANDIDATES:10}
      # 注意是 compatible-api，与 chat / embedding 的 compatible-mode 不是同一个前缀，
      # 所以单独配，不从 qwen 的 base-url 拼。
      base-url: ${CLAW4J_RAG_RERANK_BASE_URL:https://dashscope.aliyuncs.com/compatible-api/v1}
      model: ${CLAW4J_RAG_RERANK_MODEL:qwen3-rerank}
      # 它在每轮检索的路上，用户等的是首字。超时或报错一律按原顺序继续。
      timeout: 2s
      # 凭据复用 claw4j.model.qwen.api-key，不另配一把。

  # ---- 链路追踪：默认一段都不导 ----
  # 关着时不起线程、不留 exporter。开了却没配 endpoint 也一条不导，启动日志会点名缺哪项。
  observability:
    enabled: ${CLAW4J_OBSERVABILITY_ENABLED:false}
    # OTLP 的 HTTP 地址，例如 http://localhost:4318（带 /v1/traces 也认）。不走 gRPC。
    endpoint: ${OTLP_ENDPOINT:}
    service-name: ${OTEL_SERVICE_NAME:claw4j}
    # 采样比例。
    sample-ratio: 1.0
    # 单次导出超时。collector 不在同机时留一次重试的余量。
    timeout: PT10S
    # 队列上限，满了会丢（丢的时候 OTel 自己打日志）。
    max-queue-size: 2048

  # ---- 靠"配了目录"打开的几层，这里不写默认值 ----
  # 给了默认目录就等于默认打开，所以只在这里列名字，怎么开见 README-adding-capabilities.md：
  #   claw4j.skills.directory      技能
  #   claw4j.subagents.directory   子 Agent
  #   claw4j.rag.directory         知识库
  #   claw4j.memory.directory      长期记忆（跨会话记住你；写进去是明文，每人一个子目录）
  #
  # 记忆有两个并列节点，不互相嵌套：
  #   claw4j.session.*   一段对话的范围与长度（压缩、换段、清理）
  #   claw4j.memory.*    跨会话留下的东西：人设之外的"你是谁、你偏好什么"
  # 长期记忆打开后模型会自己读写它；整理（claw4j.memory.dream，默认开）在后台合并重复、
  # 删掉过时的：同一人距上次满 24 小时、且又过 5 轮才跑一次。

# ---- 运维面：指标单独一个端口 ----
# 指标里有"谁被拒了几次""花了多少 token"，与业务端口混在一起，"能发消息"就等于"能看运营数据"。
# 只绑本机；接 Prometheus 时再改地址，并同时加鉴权。
management:
  server:
    port: 9090
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        # 只开这两个。env / beans 那类会把配置与内部结构整份吐出来，要用时临时打开。
        include: health,metrics
  metrics:
    tags:
      # 每个指标都带这个标签：以后接了第二个服务，数据不会混在一起。
      application: claw4j
