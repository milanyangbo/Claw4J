# Claw4J 的应用配置。
#
# 写法约定（改这份文件前先看）：
#   - 注释只回答"这是什么、默认值多少、动它之前要知道什么"。设计理由在各配置类的 javadoc
#     与 docs/design/ 下，两边不重复写——两处写同一件事，早晚改一处漏一处。
#   - claw4j.* 的每个键都有明确的拥有者：某个 @ConfigurationProperties 类，或装配类上的
#     @ConditionalOnProperty。在这里加一个没人读的键，就是又一处"配了不生效"。
#   - 模型 key 与 MCP 的 env / headers 写**句柄**：`secret:<名字>`，名字是环境变量名的小写写法
#     （P08、ADR-0002）。真值在发请求那一刻才由出口解析，配置、日志、审计、模型上下文里都只有名字。
#     裸写明文会在启动时失败并点名是哪一行——不靠"看着像凭据"来判断。
#   - 通道凭据（feishu / wecom / dingtalk / slack 里的 secret 类）**不在上面那条规则里**：
#     它们是 `${FEISHU_APP_SECRET:}` 这样的环境变量占位，真值在绑定时由 Spring 替换。
#     两边差一层不是疏忽：解析句柄的 SpringSecretResolver 在 claw4j-capability，而 channel
#     不依赖它（ChannelBoundaryTest 钉着这条边）。要让通道也用句柄，得先把 SecretResolver
#     接口下沉到 core——那是另一件事，P12 的 Comments 里记着这个偏差。

spring:
  application:
    name: claw4j

  # ---- 运行环境：默认什么都不拉 ----
  # 没有 Docker 时应用照样启动（Hikari 懒连接、Flyway 关）。需要库时用 local profile：
  # 由 Boot 拉起 compose.yaml 并打开迁移，模板见 application-local.yml.example。
  docker:
    compose:
      enabled: false

  datasource:
    url: ${CLAW4J_DB_URL:jdbc:postgresql://localhost:5432/claw4j}
    username: ${CLAW4J_DB_USER:claw4j}
    password: ${CLAW4J_DB_PASSWORD:claw4j}
    driver-class-name: org.postgresql.Driver

  # 迁移要在启动时真连库；默认开着的话，"没 Docker 也能起"那条承诺就没了。
  flyway:
    enabled: false

  ai:
    session:
      # 会话寿命。框架默认 null——"没配"与"永不过期"在配置上长得一样，所以必须显式写。
      # 30 天是业务口径（跨月的"上个月那批单子"还问得出来）。它只是行上的时间戳，
      # 真正把过期行删掉的是 claw4j.session.cleanup-interval 那个后台任务。
      time-to-live: 30d
      repository:
        jdbc:
          # 建表归 Flyway（claw4j-agent 的 V3）。框架那个 initializer 默认只在嵌入式库上跑，
          # 在 Postgres 上什么都不做——"以为建了其实没建"，而且它建 bean 时就要探测驱动类型。
          initialize-schema: never
    mcp:
      client:
        # 由本项目的 McpToolAutoConfiguration 接管（ADR-0002 / 0003）。框架那份会注册一个空的
        # ToolCallbackProvider（按类型注入的地方直接装配失败），两套机制还会把同一个工具收两遍。
        enabled: false

claw4j:
  # ---- 模型：一个 key 都没有就启动失败（ADR-0011，没有 mock 兜底） ----
  # 两家都配时 primary 决定谁先上，另一家是备。主家没配 key 时也启动失败，
  # 不会悄悄拿备用那家顶上——"我以为在用千问、其实还在 DeepSeek"要靠失败暴露。
  # api-key 写的是句柄（P08）：secret:deepseek_api_key 对应环境变量 DEEPSEEK_API_KEY
  #（本机也可以写进 .env，它由 local profile 导入；句柄名与变量名是同一个东西的两种写法）。
  # 句柄取不到真值时启动失败，报错只说名字、不说值。
  model:
    primary: ${CLAW4J_MODEL_PRIMARY:deepseek}
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: secret:deepseek_api_key
      model: ${DEEPSEEK_MODEL:deepseek-chat}
    qwen:
      base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: secret:qwen_api_key
      model: ${QWEN_MODEL:qwen-plus}

    # ---- 向量模型：语义缓存与知识库共用这一份（P10 从 claw4j.cache 下面搬上来） ----
    # 它跟着 qwen 的凭据走（DeepSeek 没有 embedding 接口），但**不跟着任何功能的开关走**：
    # 原先它挂在 claw4j.cache.enabled 上，于是"关掉缓存"这个省钱开关会连带让知识库起不来。
    # 现在只有一个条件——配了 qwen key。关掉缓存之后它还在，只是没人调用（懒加载，不发请求）。
    embedding:
      model: ${QWEN_EMBEDDING_MODEL:text-embedding-v3}
      # 必须与 V4（缓存）和 V15（知识库）两个迁移里的 vector(1024) 一致。
      # 改这个数要同时改两处迁移：维度不符时 Postgres 直接报错，不会静默截断。
      dimensions: 1024

  # ---- 这个部署是哪个 agent（P15） ----
  # 三样东西以前都没有配置入口：系统提示词是 Java 常量（改一个字要重新编译）、
  # 业务口径被抄在各份 Skill 与子 Agent 的正文里、时间压根没进提示词。
  # 现在都从这一段来——"同一个 jar 两次部署只改配置"靠的就是它。
  agent:
    # 人设目录：顶层每份 *.md 是一个 agent（front matter 是配置，正文是系统提示词），
    # 子目录放口径。不配就用内置的最小可用人设，启动日志会说清用的是哪一个。
    directory: ${CLAW4J_AGENT_DIRECTORY:}
    # 目录里用哪一个。只有一份时可以不写；多份不写就启动失败，并把候选列出来。
    # 不猜：一个进程只跑一个 agent，猜错的表现是"这个部署怎么说话像销售"，没有报错。
    default: ${CLAW4J_AGENT_DEFAULT:}
    # "今天"按哪个时区算。默认取业务时区而不是技术默认——
    # 容器里 ZoneId.systemDefault() 通常是 UTC，差八小时会让晚上八点之后的"今天"变成明天。
    # 时间由 AgentContextAdvisor **每轮**算，不是启动时算一次。
    zone: ${CLAW4J_AGENT_ZONE:Asia/Shanghai}

  # ---- 通道：谁能进来 ----
  channel:
    http:
      enabled: ${CLAW4J_HTTP_ENABLED:true}
      # 请求没带角色头时用它。给最小权限而不是拒绝：本机 curl 演示不该先去配角色。
      default-role: read-only
      # 授权表**只有这一份**，飞书也按角色名用它（见下面的 feishu.roles）。加动作只改这里。
      # 认人由通道做、授权从这里查表、Agent 只执行（ADR-0007）。actions 与工具的动作名同口径：
      #   read            读业务表，范围由 tables 决定。**知识库也用它**，伪表名是 doc（P10）
      #   use_skill       加载一份做法。它本身不读表，真正碰表那一步仍各自鉴权
      #   delegate_task   委派给子 Agent。委派不提权：子 Agent 用父的身份，照样过鉴权看表
      #   read_system     看 JVM/容器指标。不是业务数据，也不是"能读表的人"就该看的运维信息
      #   recall_session  读自己的历史。不复用 read："能不能回忆"与"能不能查销售单"是两件事
      #   update_plan     改自己这一件事（run）的计划。写的是 run 的 step，不是业务表
      #   schedule_task   定一个"以后按点做"的任务（P05）。给它是安全的：任务到点按创建者
      #                   **当时**的权限跑，所以它永远不比这个人现在能做的更多
      #   list_schedules  看自己有哪些定时任务
      #   cancel_schedule 取消自己定的任务。只碰自己的：按归属键判，不按编号判
      #   draft_script    提交脚本草稿。只给 admin：能提议不等于能执行（run_script 是另一个动作）
      #   "*"             全部
      # 表里没有的角色一律拒绝，没有默认角色兜底。
      roles:
        # "*" 也包含知识库那个伪表 doc，所以 read-only 能检索知识库。
        # guest 只给了 region，于是**看不到知识库**——那是想要的默认（能查业务表不等于能看制度文档），
        # 但必须写在这里：不写的话，某天会变成"配了知识库，某个角色问什么都说没有"。
        read-only:
          tables: ["*"]
          actions: ["read", "use_skill", "delegate_task", "read_system", "recall_session",
                    "update_plan", "schedule_task", "list_schedules", "cancel_schedule"]
        # 表级的例子：会读，但读不到 sales_order，问成交额拿到的是明确的"没权限"
        guest:
          tables: ["region"]
          actions: ["read", "use_skill", "delegate_task"]
        admin:
          tables: ["*"]
          actions: ["*"]
    feishu:
      # 凭据齐全才装配，缺一个整个通道退让（HTTP 照常）；配了却连不上则启动失败（ADR-0009）。
      enabled: ${CLAW4J_FEISHU_ENABLED:true}
      app-id: ${FEISHU_APP_ID:}
      app-secret: ${FEISHU_APP_SECRET:}
      # 等长连接就绪的上限。少了它，"还在连"与"连不上"在日志里长得一样。
      ready-timeout: 15s
      # 这里只登记"谁是谁"（飞书 open_id），**不写 tables/actions**：授权共用上面 http 那份，
      # 角色名必须对得上，错一个就启动失败。open_id 是真实的人，填在 application-local.yml。
      roles:
        read-only:
          users: []

    # ---- 企业微信（P06）：入站是公网回调地址，出站是一次 POST ----
    # 五样齐了才装配（corp-id / corp-secret / agent-id / token / encoding-aes-key），
    # 少一样整份退让、只跑 HTTP——只跑演示通道的部署不该因为"没配企微"而起不来。
    # 回调地址固定是 /api/wecom/callback：后台"接收消息 → URL"填它，同一页上的 Token 与
    # EncodingAESKey 与这里一一对应。三样里错一个的表现都一样：回调静默失败，用户永远等不到回答。
    wecom:
      enabled: ${CLAW4J_WECOM_ENABLED:true}
      corp-id: ${WECOM_CORP_ID:}
      corp-secret: ${WECOM_CORP_SECRET:}
      # AgentId 是数字，缺省 0 表示没配（装配条件会因此不成立，而不是拿 0 去发消息）
      agent-id: ${WECOM_AGENT_ID:0}
      token: ${WECOM_TOKEN:}
      encoding-aes-key: ${WECOM_ENCODING_AES_KEY:}
      # 这里只登记"谁是谁"（成员 UserID），**不写 tables/actions**：授权共用上面 http 那份，
      # 角色名必须对得上，错一个就启动失败。UserID 是真人，填在 application-local.yml。
      roles:
        read-only:
          users: []

    # ---- 钉钉（P12）：入站是公网回调地址，报文是**明文 JSON**、签名在 header 里 ----
    # 与上面两条最大的不同：报文不加密，所以验签是唯一的门。少一道就是"公网端点直连模型"。
    # 三样齐了才装配（client-id / client-secret / robot-code），少一样整份退让、只跑 HTTP。
    # 回调地址固定是 /api/dingtalk/callback：开发者后台"机器人 → 消息接收地址"填它。
    # client-secret 同时干两件事——换 token、**验签**：配错它既有"发不出去"也有"所有回调被拒"。
    dingtalk:
      enabled: ${CLAW4J_DINGTALK_ENABLED:true}
      client-id: ${DINGTALK_CLIENT_ID:}
      client-secret: ${DINGTALK_CLIENT_SECRET:}
      # RobotCode 通常与 Client ID 同值，但它是一个独立配置项（换机器人不必换应用凭据）。
      robot-code: ${DINGTALK_ROBOT_CODE:}
      # 这里只登记"谁是谁"（企业内 userId），**不写 tables/actions**：授权共用上面 http 那份，
      # 角色名必须对得上，错一个就启动失败。userId 是真人，填在 application-local.yml。
      # 注意这里没有"默认角色"：机器人没发布上线时钉钉不返回 senderStaffId，
      # 那种情况会记一条"钉钉没给身份"的 WARN，不是"这个人没登记"。
      roles:
        read-only:
          users: []

    # ---- Slack（P13）：入站是 Events API 的公网回调，报文是**明文 JSON**、签名在 header 里 ----
    # 与钉钉最大的不同：签名覆盖**整个原始报文**（v0:timestamp:body），所以控制器收的是字符串，
    # 反序列化再拼回去就验不过。时间戳是**秒**、窗口 5 分钟（钉钉是毫秒、1 小时）。
    # 两样齐了才装配（signing-secret / bot-token），少一样整份退让、只跑 HTTP。
    # 请求地址固定是 /api/slack/events：App 后台 → Event Subscriptions → Request URL 填它，
    # 并在同一页订阅 app_mention 与 message.im（**两个都要**：私聊不走 app_mention）。
    # 两把凭据各管一头，不要混：signing-secret 只验签，bot-token（xoxb- 开头、长期有效）只发消息。
    slack:
      enabled: ${CLAW4J_SLACK_ENABLED:true}
      signing-secret: ${SLACK_SIGNING_SECRET:}
      bot-token: ${SLACK_BOT_TOKEN:}
      # 同频道两条消息之间的最小间隔，默认 1 秒（Slack 的 chat.postMessage 限流）。
      # 调小不会更快，只会撞 429；而撞上之后 InboundDispatcher 会停在第 2 段，用户收到半截答案。
      min-interval: 1s
      # 这里只登记"谁是谁"（Slack user id，U 开头），**不写 tables/actions**：授权共用上面 http 那份，
      # 角色名必须对得上，错一个就启动失败。user id 是真人，填在 application-local.yml。
      roles:
        read-only:
          users: []

  # ---- 入站拦截：命中词表任意一条就整轮拒答，连模型都不调、也不进会话历史 ----
  # 词表为空时整个 Advisor 不装配——"配了但一条都没拦"与"根本没装"在容器里长得一样。
  # 这份表是自拟的：官方只给机制不给词表，通用敏感词库是内容审核用的、判据宽得多。
  # 匹配是子串 + 大小写不敏感，挡的是随口一问；有备而来的改写靠权限与数据本身兜住（ADR-0007）。
  guard:
    sensitive-words:
      # 套取系统提示词
      - "系统提示词"
      - "你的系统指令"
      - "system prompt"
      - "repeat your instructions"
      # 覆盖既有指令。写成整句而不是"忽略之前"——后者在业务对话里太常见
      #（"忽略之前的条件，按新口径算"），放进来会天天误伤。
      - "忽略之前的指令"
      - "忽略以上指令"
      - "ignore previous instructions"
      - "ignore all previous"
      - "disregard the system"
      # 提权诱导
      - "绕过权限"
      - "跳过鉴权"
      - "开发者模式"

  # ---- 记忆与一段对话的边界 ----
  session:
    # 过期会话的清理间隔。写出来是为了让人知道有这个后台任务：不写也成立
    # （@Scheduled 上的默认值同样是 PT1H），但"有一个每小时删东西的任务"不该只活在代码里。
    # 压缩阈值那几个数走代码默认值，换模型时才需要动（见 SessionMemoryProperties）。
    cleanup-interval: PT1H
    # 换段 = 换对话（ADR-0026）。换段之后记忆、预算、召回都从零开始，旧段留在库里只读。
    # 这里是"会话什么时候结束"**唯一**的定义：以前它散在四处（记忆认为永不结束、
    # 预算按 120 分钟自己判、TTL 按 30 天删行、定时任务借用创建者那一份），
    # 四个答案各自都说得通，合起来就是"会话"这个词没有定义。
    reset:
      # daily-and-idle：跨天或空闲，谁先到算谁（与 OpenClaw 的默认一致）
      # idle：只看空闲，适合"一段对话跟一个项目走"
      # none：永不结束，sessionId 退回加段之前的形状，且一次库都不查
      mode: daily-and-idle
      # 逻辑日的分界点。4 点的意思是"凌晨三点还在聊的那件事，还是昨天那件"。
      # 时区取 claw4j.agent.zone，不取容器时区——容器里通常是 UTC，
      # 差八小时会让东八区凌晨 0~8 点的行为全错，而 CI 上（UTC）是绿的。
      at-hour: 4
      # 多久没动静算结束。OpenClaw 的 idleMinutes 默认也是 120。
      # 行业里没有哪个 Agent 框架判定"用户这件事做完了"——判不了，
      # 判错的代价是把人卡住；能判的只有"多久没说话"。
      idle-minutes: 120

  # ---- run：一件"事"的执行记录（A01/A02/A03）与它的预算（A04） ----
  run:
    # 关掉之后"继续"、计划、审批、审计都没有挂载点，预算也不再累计。
    enabled: true
    # 一段会话的三项上限。三项里任何一项撞线，这一轮就停在 budget_exhausted：
    # 不抛异常，把结局写进库里。
    #
    # **挂会话，不挂 run**（ADR-0025）：run 的寿命是一轮——每轮答完就 finish(DONE)，
    # 下一轮开的是新 run。所以"跨轮累计"以前从来没有发生过：三轮各调 6 次、
    # 一共 18 次，每一次都落在新 run 的 0/6 之内。现在按会话累计，
    # 同一段对话里的所有 run 共用这三个数。
    budget:
      # 工具调用次数。同一段会话累计：三轮各调两次，第 7 次会被挡住。
      max-tool-calls: 6
      # token 总数。模型没报 usage 就记 0，不拿估算值冒充
      max-tokens: 100000
      # 各轮实际耗时的累计秒数。不含等待：等审批那一段没有任何一轮在跑
      max-seconds: 900

  # ---- 审批：一次点头能放行多远、谁能点头（P02、P03） ----
  approval:
    # 一条请求等人等多久。默认十分钟。
    # 太短则审批人开个会回来卡片已经作废，人会开始要求刷新而不是点按钮；
    # 太长则一条被忘掉的请求三天后还能放行，而三天前的上下文早就不是现在要干的事了。
    # 过期判定用的是库的时钟（now() 与 expires_at 同一个来源），不是应用进程的。
    ttl: 10m
    # 谁能批。与 claw4j.channel.http.roles 是两张表：那个回答"能读哪些表"，
    # 这个回答"愿意为别人的操作负责"。挂到角色上的话，任何一次提权都会静默扩大审批面。
    # 飞书那边的人填 open_id，HTTP 那边填用户名（两个 id 空间各自独立）。
    # 空 = 没人能批：忘配置时请求会一直挂着直到过期，启动日志里有一条 WARN 说明这件事。
    # 这里不写默认人：默认值会让"没配"和"配了一个不存在的人"看起来一样。
    approvers: []

  # ---- 定时任务：到点 = 创建一个 run（P04、P05） ----
  schedule:
    # 关掉之后扫描任务与那三个工具（schedule_task / list_schedules / cancel_schedule）
    # 一起不装配（表与已建的任务照旧保留，重新打开即恢复）。能建任务却没有东西会跑它，
    # 等于对用户说"已经定好了"而实际不会发生。
    # 它的读者是那几个 @Bean 上的 @ConditionalOnProperty，不是 ScheduleProperties——
    # 在那里再声明一次就是"人人都以为自己读了的键"。
    enabled: true
    # 扫表间隔。它只被 @Scheduled 读（占位符原文），写 0 会让调度退化成热循环，
    # 所以非法值在 ScheduleProperties 里直接拒绝启动，不静默归一到 30 秒。
    scan-interval: PT30S
    # 一次扫描最多认领几条，逐条串行跑完再回来看下一轮。
    # 调大等于让 "同一时刻有 N 个模型调用在烧不同人的额度"——没做配额之前，串行是唯一说得清的算法。
    max-per-scan: 5
    # 连续几次没跑成就自动停用（并推一条带最后错误的通知）。成功一次清零。
    # 只对"可能是暂时的"失败计数（模型抽风、库连不上）。角色被删、工具权限被收回
    # 这类问题再试三次也不会变好，它们当场停用——见 ScheduleScanner#fire。
    failure-threshold: 3
    # 一条被认领之后占多久。管的是"认领之后进程崩了"：行锁随连接消失，
    # 没有租约的话那条任务会一直躺在"已认领"里没人敢再跑。
    lease: PT5M

  # ---- 审计：一次工具调用一行，写在 step 上（P07，ADR-0023） ----
  # 这里只有一个数：留多久。行本身没有开关——它跟着 claw4j.run.enabled 走，
  # 因为"审计行"就是 step，没有 run 存储就没有可写的落点。
  # 查询走视图 claw4j_run.audit_trail（按人 / 按时间 / 按结局三格都能过滤），
  # 那三句 SQL 抄在 docs/capability-tests.md 里。
  audit:
    # 90 天：一个季度的口径。短于它，季度复盘时"上个季度谁批了什么"就查不到了；
    # 长于它，那 200 字符的参数摘要会跟会话记录一起变成没人清理的历史。
    # 到点删的是整件旧事（run 级联带走 step），审批按提出时间单独删——
    # 它没有外键，不单独删的话"谁批过"会无限期长下去。
    retention: P90D
    # 清理任务之间隔多久。写出来是为了让人知道有这个后台任务：
    # 不写也成立（@Scheduled 上的默认值同样是 24 小时）。
    purge-interval: PT24H

  # ---- 工具检索：工具循环只有这一种，没有"要不要开"的开关，也没有"少于几个就全塞"的阈值 ----
  # 代价是工具集很小时也要多一次检索往返；收益是模型看到的行为不随工具数量改变。
  tool-search:
    # 一次检索返回几个候选（框架约定 1–10）。给多了等于把省下来的 token 又还回去一部分。
    max-results: 5

  # ---- 工具档位：这个部署允许出现到哪一档（P09） ----
  # 四档是累进的：minimal < messaging < coding < full。每个工具声明它**最低**需要哪一档，
  # 声明档不高于 profile 的工具才进清单——不在清单里的工具，检索也检索不到。
  # 按"清单"而不是"调了被拒"：后者会让模型先计划再撞墙，白烧一轮上下文。
  # 默认 full = 升级前后一模一样。minimal 只留检索 / 计划 / 会话记忆 / 进程状态四类；
  # messaging 是"只做消息与问答"的部署，脚本类工具在这一档消失，而查表不受影响。
  tools:
    profile: ${CLAW4J_TOOLS_PROFILE:full}
    # 白名单：只能**收窄**，不能越过 profile。想"messaging 档但要一个脚本"，
    # 只能调高 profile 再 deny 掉别的——否则 allow 就成了绕过档位的口子。
    allow: []
    # 黑名单：在档位与白名单之后生效。同一个名字同时写进 allow 与 deny 会启动失败。
    # 写了清单里不存在的名字不报错（部署裁剪时它本来就该落空），但启动日志会列出来——
    # 因为拼错也长这样，而拼错的那一条永远不生效。
    deny: []

  # ---- 把自己交出去：当 MCP server 用（P11） ----
  # 默认关。开了之后在标准输入输出上说 MCP，Claude Code 这类客户端可以把这里的工具
  # 当成自己的工具调。交出去的工具只能是"模型能用的那一份"里的——不是另收一遍，
  # 所以档位与 allow/deny 在它上面照常生效。
  # stdio 的硬约束：**stdout 是协议通道**，日志与横幅一个字节都不能往那去。
  # 因此不要直接用默认日志配置起它，用 application-mcp-stdio.yml 那一份（见 README）。
  mcp:
    server:
      enabled: ${CLAW4J_MCP_SERVER_ENABLED:false}
      # 交出去哪几个。默认空＝一个都不交；开着却一个都不交是启动失败
      #（客户端连得上、握手成功、拿到空清单——看起来像 server 坏了）。
      # 只能写清单里有的工具：写错或没装那个模块只告警并跳过。
      # 需要审批的工具、动作不是 read 的工具交不出去，启动时就失败并点名。
      expose: []
      # 外部客户端能读的表。它与 channel.http.roles 那张授权表**无关**：
      # 客户端没有 IM 身份，拿它去查角色表只能靠猜。默认与只读身份同口径。
      # 收窄之后，工具要读的表对不上就在调用时被拒——拒绝落在执行之前，工具一次都不会跑。
      tables: ["*"]

  # ---- 语义缓存：只在配了通义 key 时整套装配（向量走 text-embedding-v3，复用 qwen 凭据） ----
  # 只配 DeepSeek 的环境没有这个能力，对话照常——它是成本优化，不是依赖。
  cache:
    enabled: ${CLAW4J_CACHE_ENABLED:true}
    # 0.93 取的是"宁漏不误"那一侧：换指标（0.9154）与同义改写（0.9117~0.9501）的分数是交叠的，
    # 任何阈值都分不开，只能选往哪边错——漏了只是没省到钱，误了是给出另一个问题的答案。
    # 完整的实测表在 CacheProperties.DEFAULT_SIMILARITY_THRESHOLD 的 javadoc 里。
    similarity-threshold: ${CLAW4J_CACHE_THRESHOLD:0.93}
    # 1 小时：问的是"上周/本周"这种相对时间，答案随日历翻页而变，24 小时会在跨周一时给出上一周的。
    # 另外「上周」与「上上周」的相似度高达 0.995，比同义改写还高，单靠阈值挡不住——所以问题里的
    # 时间词与数字被编进缓存上下文键（不可配，见 CacheAdvisor#entitySignature）。
    time-to-live: PT1H
    cleanup-interval: PT1H
    # 向量模型的两项配置**不在这里**（P10 搬去了 claw4j.model.embedding）：
    # 知识库要用同一个模型，而这里的 enabled 是成本开关。放在这里 = 关掉缓存就连带关掉知识库。

  # ---- 知识库检索（P10）：向量 + 关键词两路，结果带出处 ----
  # 默认关：它要一份文档目录与一次 embedding 调用，绝大多数部署没有这两样。
  # 这与 claw4j.skills.directory 那几个键同一条约定——不配就是没有这一层。
  #
  # 开着就必须能用：缺目录、目录不存在、目录里一个 .md/.txt 都没有、embedding 算不出来，
  # 四种都是**启动失败并点名**。反过来（启动成功但库是空的）更糟：每次检索都答
  # "没有相关资料"，而那与"这段确实没写"在用户看来完全一样。
  rag:
    enabled: ${CLAW4J_RAG_ENABLED:false}
    # 文档目录，递归找 .md / .txt。启动后同步一次，按文件内容哈希跳过没变的；
    # 文件删了，库里的块也跟着删（目录是事实来源）。
    directory: ${CLAW4J_RAG_DIRECTORY:}
    # 每一路各取多少条，融合之后再取多少条。
    top-k: ${CLAW4J_RAG_TOP_K:5}
    # 向量通道的下限。**这个数没有实测依据**（与缓存那个 0.93 不是一回事），
    # 它只负责"把明显不相关的挡掉"，排序交给 RRF 的排名。
    min-similarity: ${CLAW4J_RAG_MIN_SIMILARITY:0.5}
    # 一块文档最多多少字符。短段落会合并，超过就断开。
    max-chars: 800

  # ---- 观测：trace 走 OTLP，默认一段都不导（P14）----
  # 与上面 rag 同一条约定：默认关，配了才装。关着时容器里没有 provider、没有 exporter，
  # 也不起线程——一个空转的 provider 会带起 batch 线程与连接池，"关"不该只是少发几条数据。
  #
  # **开了却没配 endpoint 时一条也不导**，启动日志会点名缺哪一项。不回落
  # "localhost:4318"：那样每 5 秒一条连接被拒，人去查网络，而真正缺的那项没人说。
  #
  # 指标仍走下面 management 那套（actuator + Prometheus），**trace 只走 OTLP**：
  # 两套导出器各配一遍端点是运维负担，而 metrics 那条路已经能用。
  #
  # 根 span 是 run（不是请求）：五个通道都把回答丢进线程池，请求的 trace 在入池那一刻就断了；
  # 而 run 跨通道、跨重试、跨重启。每个动作 span 上带 `claw4j.step.seq`，
  # 拿它加 `claw4j.run.id` 能反查回 agent_step 那一行。
  observability:
    enabled: ${CLAW4J_OBSERVABILITY_ENABLED:false}
    # OTLP HTTP 的地址，例如 http://localhost:4318（带上 /v1/traces 也认）。
    # **不走 gRPC**：exporter 的运行时依赖只带 HTTP sender，gRPC 那个编译得过、启动时找不到实现。
    endpoint: ${OTLP_ENDPOINT:}
    service-name: ${OTEL_SERVICE_NAME:claw4j}
    # 采样比例。实现是 ParentBased(TraceIdRatioBased)——裸 ratio 会出现"有 run、没有 tool"，
    # 而那种缺口在图上看起来像工具没被调用。
    sample-ratio: 1.0
    # 单次导出的超时。collector 不在同机时留一次重试的余量。
    timeout: PT10S
    # batch 队列上限。满了会丢，丢的时候 OTel 自己打日志（不另加计数器，见 P14 判据 10）。
    max-queue-size: 2048

  # ---- 能力层：配了目录才有这一层，不配就没有 ----
  # claw4j.skills.directory / claw4j.scripts.directory / claw4j.subagents.directory /
  # claw4j.generator.staging-directory（另有 review-directory / published-directory / audit-file 子键）
  # 这里刻意不给默认值：给一个默认目录就等于默认打开这一层。怎么打开见 examples/README.md。

# ---- 运维面：指标与服务端口分开 ----
# 指标里有"谁被拒了几次""花了多少 token"，和业务端口混在一起的话，"能发消息"就等于"能看运营数据"。
# 只绑本机的代价是容器里看不到——单实例本地演示是既定形态；接 Prometheus 时再改地址并同时加鉴权。
management:
  server:
    port: 9090
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        # 只开这两个。env / beans 那类会把配置与内部结构整份吐出来，
        # 它们排障有用，但那是"临时打开看一眼"的东西，不该是默认暴露面。
        include: health,metrics
  metrics:
    tags:
      # 每个指标都带这个标签：以后接了 Prometheus 或第二个服务，数据不会混在一起。
      application: claw4j
