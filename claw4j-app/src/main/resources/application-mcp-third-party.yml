# mcp-third-party profile：接两个**别人写的** MCP server，全部靠配置，没有一行 Java。
#
# 一条 stdio（npm 上的官方参考实现，起子进程），一条 Streamable HTTP（公网端点，不起进程）。
# 两者对宿主是同一件事：连上、取工具清单、按端点声明的权限鉴权——
# 差别只在 transport 那一个键，上面的连接生命周期与鉴权一行都不用改。
#
# 依赖：stdio 那条要本机有 Node（npx 首次会下载包，要出网），http 那条要能出网。
# 所以它们不在默认 profile 里——"没装 Node 的机器起不来应用"不该是一个产品的默认值。
#
# 起法：--spring.profiles.active=mcp-third-party
claw4j:
  capability:
    mcp:
      # 两个超时分开：单次调用通常几百毫秒，而握手要等启动器把包解析出来。
      # npx -y 在本机实测要 50 秒（缓存已热也一样），SDK 默认的 20 秒会把正常的 server
      # 判成 "Client failed to initialize"。接更慢的启动器就把 initialization-timeout 调大。
      request-timeout: 30s
      initialization-timeout: 90s
      servers:
        # 官方参考实现（everything server）。零参数、零凭据，工具名与返回都是确定的。
        # 它导出的工具里有几个是"模拟/开关"性质（触发长任务、开关模拟日志），不是写业务数据，
        # 所以整条按只读声明是准确的。
        everything:
          command: npx
          args:
            - -y
            - "@modelcontextprotocol/server-everything"
          # npx 要靠 PATH 找到自己、靠 HOME 放包缓存。没写进 inherit-env 的变量，
          # 子进程一律看不到——这也是应用凭据不会漏过去的同一个机制。
          inherit-env: [PATH, HOME]
          permission:
            action: read

        # DeepWiki：公开的 Streamable HTTP 端点，无需凭据（实测可 initialize）。
        # 工具都是"读某个 GitHub 仓库的文档"，只读声明与事实一致。
        deepwiki:
          transport: http
          url: https://mcp.deepwiki.com
          # endpoint 不填就走 SDK 默认的 /mcp。要连需要凭据的端点时这样写（值从环境变量来）：
          #   headers:
          #     Authorization: "Bearer ${DEEPWIKI_TOKEN}"
          permission:
            action: read

        # 混装 server 的写法（这里没有真去连，只是形状）：
        # 一个 server 同时导出"查一下"与"改一下"时，整条只给一个权限只有两个结局——
        # 写动作也被只读身份调用（权限放大），或者只读身份连查都不行（整条不可用）。
        # 所以 tools 下面可以逐个工具覆盖，没被点名的仍走 permission 那一条：
        #
        #   mail:
        #     command: npx
        #     args: ["-y", "@modelcontextprotocol/server-mail"]
        #     permission:
        #       action: read
        #     tools:
        #       send_email:
        #         action: send_email
        #         tables: [customer]
        #
        # 点了 server 并不导出的工具名，启动就失败（报错里带 server 名与实际导出的清单）。
