# mcp-demo profile：把仓库自带的 examples/mcp/ 那几个 server 接进来。
#
# 这三条与 mcp-third-party 那份是同一件事的两面——那份接"装在公网上的"，
# 这份接"放在仓库里的"。两边对宿主没有区别：一份配置 = 一条连接，
# server 用什么语言写、放在哪里，宿主都不知道也不需要知道。
# 所以这里**没有**配套的 Java 类：一个 `McpDemoConfiguration` 曾经存在过，
# 它做的事就是拼三个绝对路径，而这件事配置本身就能表达。
#
# 依赖（缺了也能启动，只是调用时返回一句"怎么装"，见各自脚本的 docstring）：
#   - 本机要有 python3
#   - github 那条还要 gh 可执行且已登录
#   - mail 那条要 himalaya 且配好账户
#
# 起法（在**仓库根目录**）：
#   java -jar claw4j-app/target/claw4j-app-0.1.0-SNAPSHOT.jar --spring.profiles.active=mcp-demo
#
# 路径是相对的，因为 stdio 的子进程继承宿主的 CWD（工作目录）。
# 从别的目录启动（systemd、容器）就把它换成绝对路径，或用命令行覆盖单个值：
#   --claw4j.capability.mcp.servers.github.args[0]=/opt/claw4j/examples/mcp/gh_mcp_server.py
#
# 环境变量默认只给 PATH（McpServerProperties.Server#inheritEnv 的默认值）：
# 子进程拿不到应用的模型 key 与数据库口令，需要什么就在这里显式加。
claw4j:
  capability:
    mcp:
      servers:
        # 不依赖任何外部 CLI 的那个：一个回话、一个报时。
        # 它的用处是证明"Java 真的起了另一个进程、真的说通了协议"——
        # demo_now 每次都返回不同的 pid 与时间戳，于是"结果确实来自新起的进程"是可判定的。
        demo:
          command: python3
          args:
            - examples/mcp/demo_mcp_server.py
          permission:
            action: read

        # 把 gh 包成只读能力：列表、CI 状态、API 查询。开 issue / 合 PR 不在这个 server 里，
        # 所以整条按只读声明是准确的。
        github:
          command: python3
          args:
            - examples/mcp/gh_mcp_server.py
          permission:
            action: read

        # 混装的那一个：mail_list_unread 是读，mail_send 有副作用。
        # 整条只给一个权限只有两个结局——写动作也被只读身份调用（权限放大），
        # 或者只读身份连读都不行（整条不可用）。所以这里按工具覆盖：
        # 兜底是 read，只有 mail_send 这一条要 send_email。
        mail:
          command: python3
          args:
            - examples/mcp/himalaya_mcp_server.py
          permission:
            action: read
          tools:
            mail_send:
              action: send_email
