# 检索层评测的 gold。
#
# 每条 = 一个问题 + 参考答案 + 答案所在的原句（gold_spans，一组而不是一条）。
# 绑句子不绑段号：段号随切块参数变，改一次 chunk-size 或切块算法，整份评估集就过期，
# 而过期的评估集比没有更糟——它给出可信的假分数。
#
# 证据写成列表，只有一处也写成列表：允许"单对象或列表"两种形状，下一个人就会两种都用。
# 一处证据 = doc 里的一段原句；多跳题与跨文档题写多处，缺任何一处 recall 就只有 0.5。
#
# span 抄文档原句即可，不必带 Markdown 的 ** 强调：比对时会去掉标记与空白。
# doc 用来消歧：同一句话在两份文档里出现时，靠它决定命中的是哪一份。
#
# 覆盖（不按数量堆，每一类对应一种真实的检索失效）：
#   单跳事实 / 表格数据 / 多跳（两处证据，同类多跳题第二跳原先没标）/ 否定与例外
#   无答案（该说没有）/ 已废止旧版 / 口语化 / 同形状数字 / 会议纪要与政策的冲突 / 跨文档
#   跨块（同一份长文档的两段）/ 长文档（4000+ 字符，答案埋在小节中间）
#
# 无答案那几条的 span 指向"边界文档"——比如问 2027 年价格，指向 2026 价格表里
# "自 2026 年 1 月 1 日起执行"那句。标准不是"什么都不召回"，是"召回到能支撑拒答的那一段"。

