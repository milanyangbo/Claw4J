- id: rag-overdue-interest
  question: 月结客户逾期回款怎么计息，利息滚入本金吗？
  reference: 从到期日的次日起按未回款金额每日万分之五计息，计息不滚入本金。
  gold_span:
    doc: settlement.md
    span: 从到期日的次日起按未回款金额每日万分之五计息，计息不滚入本金

