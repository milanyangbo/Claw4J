      span: 翻新机单独保修 6 个月，从翻新出库日算，不可转移、不可延保

- id: rag-confuse-50percent
  question: 哪些押金是按 50% 收的？
  reference: 备机押金与备件借用押金都是目录价 50%；样品是 100%，培训设备是每台 2000 元。
  gold_spans:
    - doc: deposit-rules.md
      span: 备机押金 | 备机目录价的 50%

# ---------------------------------------------------------------- 会议纪要与政策的冲突

- id: rag-meeting-return-10days
  question: 华东的退货窗口是不是要改成 10 天？
  reference: 不是。会上讨论过，结论是维持 7 天不变，理由是这套差异是渠道调整时定下的。
  gold_spans:
    - doc: meeting-notes-2026-q2.md
      span: 华东区的退货政策**维持 7 天不变**

- id: rag-meeting-a1-stop
  question: A1 要停产了吗？
  reference: 没有。会上否决了用 A2 替代 A1 的提议，A1 继续销售，停产时间未定。
  gold_spans:
    - doc: meeting-notes-2026-q2.md
      span: '**A1 与 B2 不停产**。产品部提出过"用 A2 替代 A1"，会议否决'

- id: rag-meeting-q3-price
  question: 三季度会涨价吗？
  reference: 不会。原材料涨 6% 没到 10% 的调价线；配件价格单独评估，8 月底给方案。
  gold_spans:
    - doc: meeting-notes-2026-q2.md
      span: '**三季度不做全线调价**。原材料涨了 6%，没到 10% 的调价触发线'

# ---------------------------------------------------------------- 跨文档

- id: rag-crossdoc-refund-steps
  question: 退货退款要走哪些步骤？
  reference: 退货入库验收 → 已开票的先冲红 → 冲红完成后 3 个工作日内发起退款 → 原路退回。
  gold_spans:
    - doc: after-sales.md
      span: 发票已开具的订单需先完成发票冲红，否则退款会挂起

- id: rag-crossdoc-install-free
  question: 什么情况下安装不收费？
  reference: 质保内换机重新装机、项目型订单已含安装费、年度服务合同的标准包与全包客户。
  gold_spans:
    - doc: installation-charge.md
      span: 质保期内的换机、修机后重新装机

- id: rag-crossdoc-tier-limit
  question: A 级客户的账期是多少？
  reference: 月结 60 个自然日；额度按上一年度月均采购额的 2 倍核定。B 级 30 天，C 级款到发货。
  gold_spans:
    - doc: customer-tiers.md
      span: 月结 60 个自然日
    - doc: credit-limit.md
      span: 按上一年度月均采购额的 2 倍核定

# ---------------------------------------------------------------- 长文档跨块
#
# 下面这一组考的是"答案分散在同一份长文档的两处"：只召回首处时 recall 是 0.5，
# 而单段题永远显示 1.0。语料里这几份 4000 字上下、切 4–7 段，答案埋在小节中间。

- id: rag-workflow-replace
  question: 同一台机器修了几次还没好，能要求换机吗？换机之后保修怎么算？
  reference: 同一故障维修 3 次未解决、或累计停机超 15 个工作日可申请换机；换机后保修期不重新计算，
    仍按原设备出厂日期算。
  gold_spans:
    - doc: after-sales-workflow.md
      span: 同一故障维修 3 次仍未解决
    - doc: after-sales-workflow.md
      span: 换机后原设备的保修期不重新计算

- id: rag-warehouse-return48
  question: 退回来的货多久要分完类？分成哪几类？
  reference: 入库后 48 小时内完成分类，分"可再销售 / 需维修 / 报废"三类，且退货区必须与正常库物理隔开。
  gold_spans:
    - doc: warehouse-operations.md
      span: 入库后 48 小时内完成分类
    - doc: warehouse-operations.md
      span: 退货区与正常库必须物理隔开

- id: rag-discount-rebate
  question: 一台 A2 给客户让了 10%，年底返利按哪个金额算？
  reference: 按折扣后实收算，不按目录价。A2 目录价 1680，让 10% 后实收 1512，返利基数是 1512。
  gold_spans:
    - doc: discount-approval.md
      span: 返利按折扣后实收计提，不按目录价
    - doc: price-list-2026.md
      span: '| SKU-2026-A2 | 桌面标签机（高精度） | 108mm | 300dpi | USB + 网口 + 蓝牙 | 1680 元 |'

- id: rag-aftersales-crossregion
  question: 客户注册在上海，货发到广州，退货窗口是几天？
  reference: 按收货地址算，不按注册地。广州属华南，无理由退货 5 天。
  gold_spans:
    - doc: after-sales.md
      span: 按收货地址所属区域算，不按客户注册地
    - doc: after-sales.md
      span: 华南区（广东、广西、福建、海南）的无理由退货窗口是 5 天

- id: rag-warranty-batch
  question: 多少台出现同一个故障算批量缺陷？算上之后怎么处理？
  reference: 同一型号同一批次 90 天内 3 台以上相同故障即为批量缺陷，要立即冻结该批次库存发货，
    并主动上门检测。
  gold_spans:
    - doc: warranty.md
      span: 同一型号、同一批次在 90 天内出现 3 台以上相同故障
    - doc: warranty.md
      span: 立即冻结该批次的库存发货

- id: rag-tier-group
  question: 集团下两家子公司各自回款都不够 300 万，能按 A 级算吗？
  reference: 同一集团下的子公司默认合并计算回款额定级，能证明关联关系（同一控股方超 50%）即可合并。
  gold_spans:
    - doc: customer-tiers.md
      span: 默认合并计算回款额定级
    - doc: customer-tiers.md
      span: A 级 300 万元以上，B 级 60 万元以上

- id: rag-workflow-selfrepair
  question: 客户想自己换打印头，能远程指导他拆吗？
  reference: 不能。拆机壳、换打印头、动电源模块、刷固件都不允许客户自修。
  gold_spans:
    - doc: after-sales-workflow.md
      span: 拆机壳、换打印头、动电源模块、刷固件

- id: rag-workflow-firstfix
  question: 首次解决率现在是多少？
  reference: 68%，定义为一次上门或一次远程就关闭的工单占比。
  gold_spans:
    - doc: after-sales-workflow.md
      span: '| 首次解决率 | 一次上门或一次远程就关闭的工单占比 | 68% |'

- id: rag-warehouse-pending
  question: 到货之后最晚多久必须检验完上架？
  reference: 待检区停留不超过 1 个工作日，检验结论必须当天出。
  gold_spans:
    - doc: warehouse-operations.md
      span: 待检区停留不超过 1 个工作日

- id: rag-discount-range
  question: 给客户让 12% 要谁批，多久能批下来？
  reference: 10%–20% 由区域销售经理批，时限 1 个工作日。
  gold_spans:
    - doc: discount-approval.md
      span: 10–20% | 9 折到 8 折 | 区域销售经理 | 1 个工作日

- id: rag-deposit-nodeduct
  question: 客户还欠着货款，能不能直接从押金里扣？
  reference: 不能。押金不是担保金，不能拿来抵逾期货款，否则等于用押金变相延长账期。
  gold_spans:
    - doc: deposit-rules.md
      span: 押金不是担保金，不能拿来抵逾期货款

- id: rag-credit-prepay
  question: 客户把订单改成预付，还占信用额度吗？
  reference: 不占。预付订单的金额直接从额度占用里剔除，因为钱已经收了，不存在信用风险。
  gold_spans:
    - doc: credit-limit.md
      span: 预付订单不占额度
