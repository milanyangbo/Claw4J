# L2 端到端题库（票 23 第 2 批）：这些话说出来，目录里没有任何工具该被调用。
#
# 与 BFCL 的 irrelevance 档分工不同，不能互换：
#   BFCL   英文、每题只给 1 个工具、由 BFCL 自己的判据判（AST 比对）。
#   本文件 中文、工具集是我们真实的目录（24 个左右）、判据是「这一轮有没有调业务工具」。
# 语言与候选数都不同，所以 L2 的结论只能与 L2 的其他组比，不能拿去和 76.25% 比。
#
# 出题约束：**目录里任何工具都不该做这件事**。这一点比 BFCL 更严——我们手上有 Bash，
# 所以「算个数学题」这类不算，它真的能用 Bash 算出来。只留六类真正越界的：
#   chitchat       情绪、寒暄、闲聊
#   knowledge      百科知识（没有搜索工具，WebFetch 要 URL）
#   external-fact  外部实时事实（天气、行情、票务、限行、影讯）
#   transaction    需要下单/支付/预约/改地址的服务
#   meta           指回对话本身（"你刚才那句什么意思"）
#   opinion        征询主观判断（没有工具能回答"我该不该"）
#
# 每条 10 个，一格 1.67pt。60 条是成本与分辨率的折中：30 条一格 3.3pt，
# 比 BFCL 单次跑的 1–2 题噪声还粗，跑出来的差异说不清是效应还是抖。

