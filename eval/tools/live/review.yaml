# BFCL irrelevance 的「生产合理性」人工复核（票 29）
#
# 为什么需要这一份：BFCL 那道 irrelevance 题的判据是「**有没有解出函数调用**」，
# 而它每题只给一个函数（往往是跟问句毫不相干的）。可我们目录里有 58 个工具，
# 检索会给出 3–5 个候选——模型挑一个能答的调，BFCL 判它错，用户却会觉得它在干活。
#
# 例：「What is the current time in New York City?」→ `world_clock`。
# BFCL 判错（它那道题给的函数是别的），但这句问的就是时间，我们的工具真能答。
# 票 24 数过这类占一半以上，票 28 又遇上一次，所以把判据写下来，别再靠印象。
#
# 判据只有一句，二分：
#
#   如果助理调了这个工具，用户会觉得它在干活，还是觉得它在瞎搞？
#
#   reasonable  在干活。包括「查了但没有」（书架里没有那本书）——它必须查一次才知道没有
#   off_target  瞎搞。工具与问句是两类东西（问瑜伽垫→搜食物、问网球排名→查时钟）
#
# 这一份是**输入**，不是产物：改 verdict 分数就变，所以每次改都要能被看见。
# 结果里的题不在这里（新题或换了模型）一律算「未复核」，不计入这个分数，单独报数量。
#
# 2026-11-27 首版：48 条误调里 27 条 reasonable、21 条 off_target（生产口径 91.25%，
# BFCL 口径 80.00%）。复核人：与 Claude 对跑，逐条看问句与工具描述。

criterion: 用户会觉得它在干活（reasonable），还是在瞎搞（off_target）
