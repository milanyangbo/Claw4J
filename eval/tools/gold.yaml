# ---------------------------------------------------------------- zh-en（中文问、描述是英文）
#
# 出题三条硬规矩（2026-11-26，票 13）：
#
#   1. 不点工具名、也不出现工具名里的英文词——否则关键字那一路白送分，测的就不是跨语言。
#   2. 干扰项必须同域：问"读文件"要与 Grep/Glob 争，问"后台命令"要与 Bash/BashOutput/KillShell 争；
#      拿 querySales 当干扰项的题测不出任何东西。
#   3. 每题一个 gold。多 gold 会让 ir_measures 的 R@k 变成"覆盖比例"，与自研的"命中任一"
#      分道扬镳——要统一口径是另一件事。
#
# 能出这一档的工具，由**描述语言**决定（见 ToolGoldTest#ENGLISH_DESCRIPTION_TOOLS）：
#   AskUserQuestionTool TaskOutput Skill TodoWrite BashOutput KillShell WebFetch
#   Read Grep Glob Bash
# 中文描述的那批（recall_session Task intent schedule_* systemStatus querySales）出不了；
# Task 名字像英文，描述其实是中文。
#
# base 档已经覆盖 Glob/Grep/Read/Bash，所以这里集中在长尾六个（各三种问法）+ 一道 WebFetch 变体。
# 三种问法是刻意的：同一件事换三种说法，能看出"检索靠不靠某一个词"，而单题只能给 0/1。

- id: tools-webfetch-address
  question: 这个地址写了什么？https://example.com
  category: zh-en
  gold_tools: [WebFetch]

- id: tools-webfetch-body
  question: 帮我把这个网址的正文抓下来 https://example.com
  category: zh-en
  gold_tools: [WebFetch]

