# 2026-11-26（票 18）：上面那 12 道在 `R@5` 上五档全 1.000——不是题送分，是这批工具的同域干扰项
# 就那么几个，关键字那一路最差也翻到第 5（`github-pr-ci`、`recall-previous`），刚好卡在边界内。
#
# 下面 8 道是**去字面化**的：不点工具名，也不用工具描述里的词（销售/邮件/issue/PR/定时/提醒）。
# 出题是否到位有一条硬判据：这 8 道在 `regex` 下应当排到第 6 名以外；排得进去，说明字面还漏了。
# 它们要回答的问题：当问法里没有工具描述的词时，纯向量那一路能不能救回来。

