# ---------------------------------------------------------------- weather / media / food
# ---------------------------------------------------------------- culture / money / health
#
# 2026-11-27（票 27）：票 26 把这一片放进同一个 `life` 档，28 道题混着六件事。
# 合分只能回答"生活域整体没漏"，回答不了"哪一类在漏"——六个测量点平均成一个，
# 精度换成了好看的数字。所以按 server 拆成六档，**题目一字未改，只改 category**。
#
# 这一片存在的意义不是"再多几类题"，而是回答一个此前问不出来的问题：
# 当目录里同时有 querySales 和 weather_now，检索是**按场景**找，还是**按技术词**碰？
# 旧 24 个工具里一半以上共享"代码/文件/终端"这套词汇，那种目录下字面匹配也能拿高分。
#
# 题面照旧不点工具名、不写 API 名。同域里容易混的（tv_show_search / tv_show_detail）
# 各给一道，因为"要不要先拿编号"正是检索该学会的判断。
#
# **小档的读数下限**：一档 3–4 道题时，一题就是 0.25–0.33，比回归门的容差还粗。
# 这几档只用来判"整类有没有掉光"，不判单题的波动。

