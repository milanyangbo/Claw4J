# 工具检索的 gold：用户怎么问 → 应当翻到哪个工具。
#
# 与 eval/rag/gold.yaml 分工不同：那边判"答案的出处有没有被召回"（绑句子、要处理跨块），
# 这边判"工具名在不在前 k"。工具名是稳定标识符，不需要锚点，也不存在跨块——所以不并成一份。
#
# 题面照 tool-retrieval-benchmark（ACL 2025）的形状：用户真的会这么说，**不点工具名**，
# 干扰项是同域相近的那些（同分类里的其他工具）。
#
# 覆盖（每一类对应一种真实的检索失效，不按数量堆）：
#   base      基座工具：现在常驻，检索掉分不影响线上，但它是"索引能不能工作"的底线
#   business  中文问中文描述：掉分说明索引本身坏了，是最不该掉的一档
#   zh-en     中文问英文描述：票 04 的同义词桥与票 07 的向量各自值多少分，看这一档
#
# 没有 no-search 档（票 22）：原来有 10 道寒暄题，判据是"一个候选都不给"。那条判据量的是
# "这一轮该不该检索"，属于意图判定，不是检索——检索层对任何 query 都该给候选。能力归
# BFCL 的 irrelevance 档（240 题，判模型该不该调），不在这里重复一遍、更弱的一遍。

