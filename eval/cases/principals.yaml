# 评测用的身份。用例只写名字引用，不内联身份细节。
#
# 为什么不内联：身份散在 40 条用例里之后，改一次要读 40 处，而任何一处写错都会让那条用例
# 变成"验证了一个不存在的身份"。集中一份，改一次全对。
#
# **ADR-0030 之后身份只剩一个 userId**：原来每档写着 role / tables / actions，
# 那是"这个身份能碰哪些业务表"，随权限登记表整块下线。看得见什么由工具清单决定，
# 执行前要不要人点头由审批决定，两者都与"哪一档"无关。所以这里的分档**不代表不同的可见范围**，
# 只是不同的 userId。
#
# 名单只留被用例真正引用的：`guest` 与 `admin` 随越权那一类用例一起删了——留着没人引用的档，
# 读的人会以为"这个身份验过了"。加一档的规矩是同时有用例引用它，
# `EvalCaseSetTest#everyRosterEntryIsUsed` 盯着这条。

analyst:
  note: 正常问业务问题的那个人，多轮记忆用例也从它起

read-only:
  note: 只读场景的那个人；知识库与工具选择两类用例用它
