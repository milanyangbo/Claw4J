# 本地开发依赖：Postgres 承担业务数据、会话与知识库向量（ADR-0005）；
# 语义缓存走 Redis Stack（框架的 DefaultSemanticCache 需要 RediSearch + RedisJSON）。
#
# 用法（仓库根目录）：
#   docker compose up -d
# 或让应用自己拉起：
#   mvn -pl claw4j-app spring-boot:run -Dspring-boot.run.profiles=local
#
# 这个文件不参与生产部署，也不被打包进镜像。

# 镜像名可被环境变量覆盖，方便在国内网络下改用镜像站而不必改这个文件：
#   CLAW4J_POSTGRES_IMAGE=docker.m.daocloud.io/pgvector/pgvector:pg16
#   CLAW4J_REDIS_IMAGE=docker.m.daocloud.io/redis/redis-stack-server:latest
# 也可以写进仓库根的 .env（已被 .gitignore 忽略）。

services:
  postgres:
    image: ${CLAW4J_POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: claw4j-postgres
    environment:
      POSTGRES_DB: claw4j
      POSTGRES_USER: claw4j
      POSTGRES_PASSWORD: claw4j
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - claw4j-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claw4j -d claw4j"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 语义缓存。用 redis-stack-server 而不是 redis：普通镜像没有 RediSearch，
  # 向量索引建不出来，第一次读写就报错。
  redis:
    image: ${CLAW4J_REDIS_IMAGE:-redis/redis-stack-server:latest}
    container_name: claw4j-redis
    ports:
      - "6379:6379"
    # 缓存是可丢数据：给上限、满了按 LRU 淘汰，**不挂持久化卷**——
    # 重启后缓存全空是可接受的，而持久化只会把这个只增不减的索引写到磁盘上。
    # 注意框架的 DefaultSemanticCache 不实现 TTL（`ttl` 字段是死代码），
    # 逻辑上的失效靠"提示词里的日期变了 → contextHash 变了"，物理行只能靠这里的淘汰。
    # 这个镜像的 ENTRYPOINT 是空的、CMD 是 /entrypoint.sh，所以覆盖 command 时要带上它，
    # 否则 docker 会把第一个参数当成可执行文件（"--maxmemory": executable file not found）。
    command: ["/entrypoint.sh", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  claw4j-postgres-data:
