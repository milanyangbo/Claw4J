name: CI

on:
  push:
    branches-ignore:
      - 'gh-pages'
  pull_request:

# 同一个分支上连续 push 时，只保留最新一次构建
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mvn verify (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # 兜底：CI 上没有也不该有模型 key。测试自己也会强制 mock，
      # 这里再设一次是为了让"忘了在测试里写 properties"也不至于烧到真实额度。
      CLAW4J_MODEL_MOCK: 'true'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ADR-0004：1.x 退进 legacy/ 后不参与任何构建。
      # 根 POM 的 modules 里一旦出现 legacy，反应堆就会被一个 Spring Boot 3.3.4
      # 的旧项目拖住（它有自己独立的 groupId 与一堆已不可解析的 SNAPSHOT 依赖）。
      # 这条把"不要把它加回来"变成会失败的检查，而不是靠人记。
      - name: 反应堆里不能有 legacy
        run: |
          if grep -qE '<module>legacy</module>' pom.xml; then
            echo "::error::legacy 不得进入根 POM 的 modules，见 ADR-0004"
            exit 1
          fi
          echo "modules: $(grep -oE '<module>[^<]+</module>' pom.xml | tr -d '\n')"

      # 用 wrapper：CI 上的 Maven 版本不由 runner 镜像决定
      # -Dclaw4j.dbTests=required：runner 上没有 Docker 守护进程时让数据库测试直接失败，
      # 而不是静默跳过。跳过的绿和通过的绿长得一样，CI 上不能要那种绿。
      - name: 构建与测试
        run: ./mvnw -B -ntp verify -Dclaw4j.dbTests=required

      # "跳过的绿"和"通过的绿"长得一样：claw4j.dbTests=required 只挡住"没有 Docker"这一种情形，
      # 挡不住别的静默跳过路径。这一步把"有测试被跳过"直接判成失败——
      # 数据库那一类（只读约束、会话继承、启动迁移）曾经整类静默跳过，而构建是绿的。
      - name: 跳过的测试一律算失败
        run: ./scripts/assert-no-skipped-tests.sh

      - name: 测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
