spring:
  application:
    name: claw4j-a2a-broker
  config:
    import:
      - optional:nacos:claw4j-shared.yaml?group=CLAW4J_DEV_GROUP&refreshEnabled=true
      - optional:nacos:${spring.application.name}.yaml?group=CLAW4J_DEV_GROUP&refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: ${CLAW4J_NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: public
        group: CLAW4J_DEV_GROUP
        prefix: ${spring.application.name}
        file-extension: yaml
        refresh-enabled: true
        timeout: 3000
      discovery:
        server-addr: ${CLAW4J_NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: public
        group: CLAW4J_DEV_GROUP
        metadata:
          module: claw4j-a2a-broker
          role: a2a-broker
          port: ${server.port}
          environment: local

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
