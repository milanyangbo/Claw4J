spring:
  application:
    name: claw4j-api-gateway
  config:
    import:
      - optional:nacos:claw4j-shared.yaml?group=CLAW4J_DEV_GROUP&refreshEnabled=true
      - optional:nacos:${spring.application.name}.yaml?group=CLAW4J_DEV_GROUP&refreshEnabled=true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          claw4j-orchestrator:
            connectTimeout: 1000
            readTimeout: 300000
    sentinel:
      eager: true
      transport:
        dashboard: ${CLAW4J_SENTINEL_DASHBOARD:127.0.0.1:8858}
        port: 8719
    nacos:
      config:
        server-addr: ${CLAW4J_NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: public
        group: CLAW4J_DEV_GROUP
        prefix: ${spring.application.name}
        file-extension: yaml
        refresh-enabled: true
        timeout: 3000
      discovery:
        server-addr: ${CLAW4J_NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: public
        group: CLAW4J_DEV_GROUP
        metadata:
          module: claw4j-api-gateway
          role: gateway
          port: ${server.port}
          environment: local

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
